name: PCHM30 Clean Experimental Build

on:
  workflow_dispatch:
  push:
    branches: [exp-4.19-clean]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-clean-exp
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83

jobs:
  build:
    name: Compile Clean Experimental Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Clean Experimental Branch
        uses: actions/checkout@v4
        with:
          ref: exp-4.19-clean
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make git curl ca-certificates \
            bc bison flex libssl-dev libelf-dev libncurses-dev libtinfo5 libncurses5 \
            device-tree-compiler cpio gzip xz-utils zstd rsync unzip zip tar \
            openssl coreutils binutils file perl ccache python3

      - name: Download and verify archived PCHM30 toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p toolchain-assets "$TOOLCHAIN_ROOT"
          gh release download "$TOOLCHAIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir toolchain-assets \
            --pattern 'PCHM30-Snapdragon-LLVM-10.0.7.tar.zst' \
            --pattern 'PCHM30-GCC64-4.9-binutils2.27.tar.zst' \
            --pattern 'PCHM30-GCC32-4.9.tar.zst' \
            --pattern 'PCHM30-Qualcomm-MPGen-2.1.1-Python3-PATCHED.tar.zst' \
            --pattern 'SHA256SUMS.txt'
          pushd toolchain-assets >/dev/null
          grep -E 'PCHM30-(Snapdragon-LLVM-10\.0\.7|GCC64-4\.9-binutils2\.27|GCC32-4\.9|Qualcomm-MPGen-2\.1\.1-Python3-PATCHED)\.tar\.zst$' SHA256SUMS.txt > required.sums
          sha256sum -c required.sums
          popd >/dev/null
          for a in toolchain-assets/*.tar.zst; do
            sudo tar --zstd -xf "$a" -C "$TOOLCHAIN_ROOT"
          done
          sudo chown -R "$USER:$USER" "$TOOLCHAIN_ROOT"

      - name: Resolve and validate toolchains
        run: |
          set -Eeuo pipefail
          SD="$TOOLCHAIN_ROOT/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK"
          G64="$TOOLCHAIN_ROOT/aarch64-linux-android-4.9"
          G32="$TOOLCHAIN_ROOT/arm-linux-androideabi-4.9"
          MP="$TOOLCHAIN_ROOT/mpgen-2.1.1-py3"
          test -x "$SD/bin/clang"
          test -x "$G64/bin/aarch64-linux-android-gcc"
          test -x "$G64/bin/aarch64-linux-android-ld"
          test -x "$G32/bin/arm-linux-androideabi-gcc"
          test -f "$MP/mpgen.py"
          test -f "$MP/mpgen_kernel.py"
          ln -sfn aarch64-linux-android-ld "$G64/bin/aarch64-linux-gnu-ld"

          python3 - "$MP/mpgen_kernel.py" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          target = "        with open(sym_file, 'r') as f:\n"
          replacement = "        with open(sym_file, 'rb') as f:\n"
          if target in text:
              text = text.replace(target, replacement, 1)
              target2 = "            return f.read()\n"
              replacement2 = "            return f.read().decode('latin1')\n"
              text = text.replace(target2, replacement2, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile "$MP/mpgen_kernel.py"

          echo "SDCLANG_DIR=$SD" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$G64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$G32" >> "$GITHUB_ENV"
          echo "MPGEN_DIR=$MP" >> "$GITHUB_ENV"

      - name: Reconstruct pinned OPPO vendor tree
        run: |
          set -Eeuo pipefail
          rm -rf oppo-vendor-source source/android/vendor
          git clone --filter=blob:none --no-checkout "$OPPO_VENDOR_REPO" oppo-vendor-source
          git -C oppo-vendor-source sparse-checkout init --cone
          git -C oppo-vendor-source sparse-checkout set source/android/vendor
          git -C oppo-vendor-source checkout --detach "$OPPO_VENDOR_COMMIT"
          test "$(git -C oppo-vendor-source rev-parse HEAD)" = "$OPPO_VENDOR_COMMIT"
          cp -a oppo-vendor-source/source/android/vendor source/android/vendor
          test -f source/android/vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt/Makefile
          echo '[PASS] vendor tree successfully reconstructed'

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-exp-clean-${{ github.sha }}
          restore-keys: |
            ccache-exp-clean-

      - name: Export proven build environment
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          {
            echo "KERNEL_DIR=$KERNEL"
            echo "ARCH=arm64"
            echo "TARGET_PRODUCT=trinket"
            echo "KCONFIG_NOTIMESTAMP=true"
            echo "KBUILD_BUILD_USER=root"
            echo "KBUILD_BUILD_HOST=ubuntu-clean-ci"
            echo "KBUILD_BUILD_VERSION=1"
            echo "SHIPPING_API_LEVEL=28"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "LOCALVERSION=+"
            echo "CC=$SDCLANG_DIR/bin/clang"
            echo "REAL_CC=$SDCLANG_DIR/bin/clang"
            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            echo "LD=$GCC64_DIR/bin/aarch64-linux-android-ld"
            echo "RTIC_MPGEN=python3 $MPGEN_DIR/mpgen.py"
            echo "OPPO_STOCK_SIGNING_X509=$KERNEL/certs/pchm30-stock-signing-key.x509"
            echo "PATH=$SDCLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            echo "PYTHONPATH=$MPGEN_DIR${PYTHONPATH:+:$PYTHONPATH}"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=5G"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"

      - name: Prepare clean stock running config
        working-directory: source/android/kernel/msm-4.14
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp "$CONFIG_FILE" "$OUT_DIR/.config"
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig

      - name: Compile Clean Kernel (Trinket / PCHM30)
        working-directory: source/android/kernel/msm-4.14
        run: |
          set -Eeuo pipefail
          ccache -s
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" -j"$JOBS" Image
          ccache -s
          test -f "$OUT_DIR/arch/arm64/boot/Image"
          echo '[PASS] Clean kernel Image built successfully'

      - name: Package AnyKernel3 Zip
        working-directory: source/android/kernel/msm-4.14
        run: |
          set -Eeuo pipefail
          AK3_DIR="$GITHUB_WORKSPACE/ak3-pchm30-clean"
          rm -rf "$AK3_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
          git -C "$AK3_DIR" checkout e4b1bb25ca2aabcfd57f694a5998d87130701b71 -- .
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md"
          rm -rf "$AK3_DIR/modules" "$AK3_DIR/patch" "$AK3_DIR/ramdisk"
          rm -f "$AK3_DIR"/dtbo.img "$AK3_DIR"/dtb "$AK3_DIR"/dtb.img "$AK3_DIR"/Image.gz-dtb \
                "$AK3_DIR"/Image-dtb "$AK3_DIR"/Image.gz "$AK3_DIR"/vendor_boot.img 2>/dev/null || true

          cp -f "$GITHUB_WORKSPACE/$KERNEL_REL/build_scripts/anykernel-pchm30.sh" "$AK3_DIR/anykernel.sh"
          cp -f "$OUT_DIR/arch/arm64/boot/Image" "$AK3_DIR/Image"

          ZIP_NAME="PCHM30-Clean-Exp-AK3-${GITHUB_RUN_NUMBER}.zip"
          cd "$AK3_DIR"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' '*placeholder' >/dev/null
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload Clean Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-Clean-Exp-Kernel-${{ github.sha }}
          path: |
            PCHM30-Clean-Exp-AK3-*.zip
            PCHM30-Clean-Exp-AK3-*.zip.sha256
            source/android/kernel/msm-4.14/out-clean-exp/arch/arm64/boot/Image

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="pchm30-clean-exp-run${GITHUB_RUN_NUMBER}"
          ZIP_FILE="PCHM30-Clean-Exp-AK3-${GITHUB_RUN_NUMBER}.zip"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PCHM30 Clean Experimental Kernel (Run ${GITHUB_RUN_NUMBER})" \
            --notes "PCHM30 clean baseline build without baseband-guard or private hacks. Properly configured boot-only AnyKernel3 zip." \
            "$ZIP_FILE" "$ZIP_FILE.sha256" "$KERNEL_REL/$OUT_DIR/arch/arm64/boot/Image"
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
