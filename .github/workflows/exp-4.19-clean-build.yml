name: PCHM30 Linux 4.19 True Port Build

on:
  workflow_dispatch:
  push:
    branches: [exp-4.19-clean]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_419_REPO: https://github.com/MiBengal-Development/android_kernel_xiaomi_bengal.git
  KERNEL_419_BRANCH: '11.0'
  OUT_DIR: out-4.19

jobs:
  build-419:
    name: Compile True Linux 4.19 Kernel (OPPO PCHM30 / Trinket)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Porting Configs and Installer
        uses: actions/checkout@v4
        with:
          ref: exp-4.19-clean
          path: port-workspace
          fetch-depth: 1

      - name: Clone Linux 4.19 MSM Kernel Source Tree
        run: |
          set -Eeuo pipefail
          rm -rf kernel-4.19
          git clone --depth=1 --branch "$KERNEL_419_BRANCH" "$KERNEL_419_REPO" kernel-4.19
          echo '[PASS] Linux 4.19 kernel tree cloned successfully'
          head -n 5 kernel-4.19/Makefile

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make git curl ca-certificates \
            bc bison flex libssl-dev libelf-dev libncurses-dev libtinfo5 libncurses5 \
            device-tree-compiler cpio gzip xz-utils zstd rsync unzip zip tar \
            openssl coreutils binutils file perl ccache python3

      - name: Download and verify archived toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p toolchain-assets "$TOOLCHAIN_ROOT"
          gh release download "$TOOLCHAIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir toolchain-assets \
            --pattern 'PCHM30-Snapdragon-LLVM-10.0.7.tar.zst' \
            --pattern 'PCHM30-GCC64-4.9-binutils2.27.tar.zst' \
            --pattern 'PCHM30-GCC32-4.9.tar.zst' \
            --pattern 'SHA256SUMS.txt'
          pushd toolchain-assets >/dev/null
          grep -E 'PCHM30-(Snapdragon-LLVM-10\.0\.7|GCC64-4\.9-binutils2\.27|GCC32-4\.9)\.tar\.zst$' SHA256SUMS.txt > required.sums
          sha256sum -c required.sums
          popd >/dev/null
          for a in toolchain-assets/*.tar.zst; do
            sudo tar --zstd -xf "$a" -C "$TOOLCHAIN_ROOT"
          done
          sudo chown -R "$USER:$USER" "$TOOLCHAIN_ROOT"

      - name: Resolve and validate toolchains
        run: |
          set -Eeuo pipefail
          SD="$TOOLCHAIN_ROOT/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK"
          G64="$TOOLCHAIN_ROOT/aarch64-linux-android-4.9"
          G32="$TOOLCHAIN_ROOT/arm-linux-androideabi-4.9"
          test -x "$SD/bin/clang"
          test -x "$G64/bin/aarch64-linux-android-gcc"
          test -x "$G64/bin/aarch64-linux-android-ld"
          test -x "$G32/bin/arm-linux-androideabi-gcc"
          ln -sfn aarch64-linux-android-ld "$G64/bin/aarch64-linux-gnu-ld"

          echo "SDCLANG_DIR=$SD" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$G64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$G32" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ~/.cache/ccache
          key: ccache-419-pchm30-${{ github.sha }}
          restore-keys: |
            ccache-419-pchm30-

      - name: Export 4.19 build environment
        run: |
          set -Eeuo pipefail
          {
            echo "ARCH=arm64"
            echo "SUBARCH=arm64"
            echo "KCONFIG_NOTIMESTAMP=true"
            echo "KBUILD_BUILD_USER=port-engineer"
            echo "KBUILD_BUILD_HOST=ubuntu-419-pchm30"
            echo "KBUILD_BUILD_VERSION=1"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "CC=ccache $SDCLANG_DIR/bin/clang"
            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            echo "LD=$GCC64_DIR/bin/aarch64-linux-android-ld"
            echo "PATH=$SDCLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=5G"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_COMPRESSLEVEL=1"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"

      - name: Graft PCHM30 Port Overlay onto Linux 4.19
        run: |
          set -Eeuo pipefail
          chmod +x port-workspace/build_scripts/port-pchm30-419.sh
          bash port-workspace/build_scripts/port-pchm30-419.sh kernel-4.19 port-workspace

      - name: Prepare Linux 4.19 PCHM30 Defconfig
        working-directory: kernel-4.19
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" vendor/pchm30-perf_defconfig

          ./scripts/config --file "$OUT_DIR/.config" \
            --enable CONFIG_SECURITY_SELINUX_DEVELOP \
            --enable CONFIG_SECURITY_SELINUX_BOOTPARAM \
            --set-val CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE 1 \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_CGROUP_BPF \
            --enable CONFIG_NETFILTER_XT_MATCH_BPF \
            --enable CONFIG_NET_CLS_BPF \
            --enable CONFIG_BPF_JIT \
            --set-val CONFIG_LITTLE_CPU_MASK 15 \
            --set-val CONFIG_BIG_CPU_MASK 240

          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig

          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" syncconfig

      - name: Compile Linux 4.19 Kernel
        working-directory: kernel-4.19
        run: |
          set -Eeuo pipefail
          ccache -s
          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            KCFLAGS="-Wno-error" \
            -j"$JOBS" Image dtbs
          ccache -s
          test -f "$OUT_DIR/arch/arm64/boot/Image"
          echo '[PASS] True Linux 4.19 Image compiled successfully!'
          strings "$OUT_DIR/vmlinux" | grep -E '^Linux version 4\.19' | head -n 1

      - name: Package AnyKernel3 Zip
        run: |
          set -Eeuo pipefail
          AK3_DIR="$GITHUB_WORKSPACE/ak3-419-port"
          rm -rf "$AK3_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
          git -C "$AK3_DIR" checkout e4b1bb25ca2aabcfd57f694a5998d87130701b71 -- .
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md"
          rm -rf "$AK3_DIR/modules" "$AK3_DIR/patch" "$AK3_DIR/ramdisk"
          rm -f "$AK3_DIR"/dtbo.img "$AK3_DIR"/dtb "$AK3_DIR"/dtb.img "$AK3_DIR"/Image.gz-dtb \
                "$AK3_DIR"/Image-dtb "$AK3_DIR"/Image.gz "$AK3_DIR"/vendor_boot.img 2>/dev/null || true

          cp -f "$GITHUB_WORKSPACE/port-workspace/build_scripts/anykernel-pchm30.sh" "$AK3_DIR/anykernel.sh"
          cp -f "kernel-4.19/$OUT_DIR/arch/arm64/boot/Image" "$AK3_DIR/Image"

          # Include compiled PCHM30 DTB if present
          PCHM30_DTB="kernel-4.19/$OUT_DIR/arch/arm64/boot/dts/vendor/qcom/trinket-idp-19021.dtb"
          if [ -f "$PCHM30_DTB" ]; then
            cp -vf "$PCHM30_DTB" "$AK3_DIR/dtb"
            echo '[PASS] Included trinket-idp-19021.dtb in AnyKernel3 package'
          fi

          ZIP_NAME="PCHM30-Linux-4.19-AK3-${GITHUB_RUN_NUMBER}.zip"
          cd "$AK3_DIR"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' '*placeholder' >/dev/null
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload Clean Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-Linux-4.19-Kernel-${{ github.sha }}
          path: |
            PCHM30-Linux-4.19-AK3-*.zip
            PCHM30-Linux-4.19-AK3-*.zip.sha256
            kernel-4.19/out-4.19/arch/arm64/boot/Image

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="pchm30-linux-4.19-run${GITHUB_RUN_NUMBER}"
          ZIP_FILE="PCHM30-Linux-4.19-AK3-${GITHUB_RUN_NUMBER}.zip"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PCHM30 True Linux 4.19 Kernel (Run ${GITHUB_RUN_NUMBER})" \
            --notes "True Linux 4.19 kernel source-level port for OPPO A11x / PCHM30 (SM6125 Trinket, 19021/19051) with native BPF and SELinux develop mode. Flashable boot-only AnyKernel3 zip with PCHM30 device tree." \
            "$ZIP_FILE" "$ZIP_FILE.sha256" "kernel-4.19/$OUT_DIR/arch/arm64/boot/Image"
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-419-pchm30-${{ github.sha }}
