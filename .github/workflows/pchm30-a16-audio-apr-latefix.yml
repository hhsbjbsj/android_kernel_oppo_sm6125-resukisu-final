name: PCHM30 A16 AUDIO APR LATEFIX

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-audio-apr-latefix]
    paths:
      - '.github/workflows/pchm30-a16-audio-apr-latefix.yml'
      - '.github/scripts/exp3-a16-runtime-compat.sh'
      - '.github/scripts/exp3-orchestrate.sh'
      - '.github/scripts/exp3-btf-backport.sh'
      - '.github/scripts/exp3-btf-modern-observed.sh'
      - '.github/scripts/exp3-audio-dlkm.sh'
      - '.github/scripts/exp3-audio-wcd934x-closure.sh'
      - '.github/scripts/exp3-audio-runtime-loader.sh'
      - '.github/scripts/exp3-vendor-dlkm-package.sh'

permissions:
  contents: read

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: beaaea0eb895dc41e7b9bf5e3f39e57aa9635bab
  ROOT_SUCCESS_BRANCH: pchm30-a16-resukisu-susfs220
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  EXP1_BRANCH: pchm30-a16-btf-sockmap-exp1
  EXP1_WORKFLOW: .github/workflows/pchm30-a16-btf-sockmap-exp1-v2.yml
  WIFI_SUCCESS_BRANCH: pchm30-a16-wifi-abi-exp1
  WIFI_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-wifi-abi-exp1-build.yml
  EXP2_BRANCH: pchm30-a16-btf-exp2-diagnose
  EXP2_WORKFLOW: .github/workflows/pchm30-a16-btf-exp2-diagnose.yml
  UPSTREAM_BTF_UAPI: f063c889c9458354a92b235a51cbb60d30321070
  UPSTREAM_BTF_KERNEL: 1dc92851849cc2235a1efef8f8d5a9255efc5f13
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Run15 - APR late-DLKM sound-card population
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-bpf-only
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Build Run14 kernel baseline plus Run15 APR timing patch
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/exp3-orchestrate.sh" > "$GITHUB_WORKSPACE/exp3-orchestrate.sh"
          git show "$GITHUB_SHA:.github/scripts/exp3-btf-modern-observed.sh" > "$GITHUB_WORKSPACE/exp3-btf-modern-observed.sh"
          chmod +x "$GITHUB_WORKSPACE/exp3-orchestrate.sh" "$GITHUB_WORKSPACE/exp3-btf-modern-observed.sh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'exp3-orchestrate.sh'
          s = p.read_text()
          old = '"$GITHUB_WORKSPACE/exp3-btf-backport.sh"\n\nrun_step \'Instrument exact BTF rejection path\''
          new = '"$GITHUB_WORKSPACE/exp3-btf-backport.sh"\n"$GITHUB_WORKSPACE/exp3-btf-modern-observed.sh"\n\nrun_step \'Instrument exact BTF rejection path\''
          if old not in s:
              raise SystemExit('cannot locate BTF backport call in orchestrator')
          p.write_text(s.replace(old, new, 1))
          PY
          "$GITHUB_WORKSPACE/exp3-orchestrate.sh"

          APR="$GITHUB_WORKSPACE/source/android/vendor/qcom/opensource/audio-kernel/ipc/apr.c"
          Q6="$GITHUB_WORKSPACE/source/android/vendor/qcom/opensource/audio-kernel/dsp/q6core.c"
          grep -Fq 'PCHM30 A16 late-DLKM: schedule APR child population from probe' "$APR"
          grep -Fq 'schedule_work(&apr_priv->add_chld_dev_work);' "$APR"
          grep -Fq 'PCHM30 A16 late-DLKM: AVS not ready, defer q6core probe' "$Q6"
          grep -Fq 'return -EPROBE_DEFER;' "$Q6"
          echo '[PASS] Run15 APR/q6core source timing fix applied before DLKM build'

      - name: Rebuild full matching OPPO TRINKET audio graph
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/exp3-audio-dlkm.sh" > "$GITHUB_WORKSPACE/exp3-audio-dlkm.sh"
          chmod +x "$GITHUB_WORKSPACE/exp3-audio-dlkm.sh"
          "$GITHUB_WORKSPACE/exp3-audio-dlkm.sh"

      - name: Close WCD934X Tavil machine audio dependency
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/exp3-audio-wcd934x-closure.sh" > "$GITHUB_WORKSPACE/exp3-audio-wcd934x-closure.sh"
          chmod +x "$GITHUB_WORKSPACE/exp3-audio-wcd934x-closure.sh"
          "$GITHUB_WORKSPACE/exp3-audio-wcd934x-closure.sh"

      - name: Preserve ordered matching audio runtime loader
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/exp3-audio-runtime-loader.sh" > "$GITHUB_WORKSPACE/exp3-audio-runtime-loader.sh"
          chmod +x "$GITHUB_WORKSPACE/exp3-audio-runtime-loader.sh"
          "$GITHUB_WORKSPACE/exp3-audio-runtime-loader.sh"

      - name: Package unified matching vendor DLKM set
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/exp3-vendor-dlkm-package.sh" > "$GITHUB_WORKSPACE/exp3-vendor-dlkm-package.sh"
          chmod +x "$GITHUB_WORKSPACE/exp3-vendor-dlkm-package.sh"
          "$GITHUB_WORKSPACE/exp3-vendor-dlkm-package.sh"

      - name: Verify Run15 deliverables
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test -s "$GITHUB_WORKSPACE/PCHM30-EXP3-MATCHING-VENDOR-DLKM-KSU.zip"
          test -s "$GITHUB_WORKSPACE/audio-exp3/raw/apr_dlkm.ko"
          test -s "$GITHUB_WORKSPACE/audio-exp3/raw/q6_dlkm.ko"
          test -s "$GITHUB_WORKSPACE/audio-exp3/raw/machine_dlkm.ko"
          strings "$GITHUB_WORKSPACE/audio-exp3/raw/apr_dlkm.ko" | grep -Fq 'PCHM30 A16 late-DLKM: schedule APR child population from probe'
          strings "$GITHUB_WORKSPACE/audio-exp3/raw/q6_dlkm.ko" | grep -Fq 'PCHM30 A16 late-DLKM: AVS not ready, defer q6core probe'
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MODVERSIONS=y$' "$OUT_DIR/.config"
          echo '[PASS] Run15 exact Run14 kernel baseline + patched APR/q6core matching audio DLKMs ready'

      - name: Upload Run15 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-A16-AUDIO-APR-LATEFIX-${{ github.run_number }}
          path: |
            btf-exp3-backport.log
            wifi-module-build.log
            wlan-a16-exp1.ko
            msm_11ad_proxy-exp3.ko
            audio-dlkm-build.log
            audio-wcd934x-closure.log
            audio-exp3/**
            PCHM30-EXP3-AUDIO-DLKM-KSU.zip
            vendor-dlkm-package.log
            vendor-dlkm-exp3/**
            PCHM30-EXP3-MATCHING-VENDOR-DLKM-KSU.zip
            Image-btf-exp3.sha256
            Module.symvers.a16-btf-exp3
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/.config
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: warn
