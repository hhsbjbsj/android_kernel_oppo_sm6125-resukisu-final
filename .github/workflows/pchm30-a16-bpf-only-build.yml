name: PCHM30 A16 BPF-only Build

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-bpf-only]
    paths:
      - '.github/workflows/pchm30-a16-bpf-only-build.yml'
      - '.github/workflows/pchm30-a15-bpf-only-build.yml'
      - 'configs/**'
      - 'kernel/**'
      - 'net/**'
      - 'include/**'
      - 'security/**'
      - 'drivers/net/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: pchm30-a16-bpf-only-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config

  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83

  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4

jobs:
  build:
    name: Apply proven A15 baseline + A16 delta and build stock PCHM30 kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout clean rootless PCHM30 A16 experiment branch
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-bpf-only
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Prepare runner for proven A15 shell steps
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$GITHUB_WORKSPACE/run-a15-step.py" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          if len(sys.argv) != 2:
              raise SystemExit('usage: run-a15-step.py <step name>')

          name = sys.argv[1]
          repo = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['KERNEL_REL']
          workflow = repo / '.github/workflows/pchm30-a15-bpf-only-build.yml'
          lines = workflow.read_text().splitlines(True)
          marker = f'      - name: {name}\n'
          try:
              start = lines.index(marker)
          except ValueError:
              raise SystemExit(f'A15 workflow step not found: {name}')

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].startswith('      - name: '):
                  end = i
                  break
          block = lines[start:end]

          workdir = None
          run_index = None
          for i, line in enumerate(block):
              if line.startswith('        working-directory: '):
                  workdir = line.split(': ', 1)[1].strip()
              if line == '        run: |\n':
                  run_index = i + 1
                  break
          if run_index is None:
              raise SystemExit(f'A15 step is not a shell run step: {name}')

          script_lines = []
          for line in block[run_index:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('\n')
              else:
                  raise SystemExit(f'unexpected indentation while extracting {name}: {line!r}')
          script = ''.join(script_lines)
          cwd = repo / workdir if workdir else Path(os.environ['GITHUB_WORKSPACE'])
          print(f'===== REUSE PROVEN A15 STEP: {name} =====')
          print(f'cwd={cwd}')
          subprocess.run(['bash', '-c', 'set -Eeuo pipefail\n' + script], cwd=cwd, check=True, env=os.environ.copy())
          PY
          python3 -m py_compile "$GITHUB_WORKSPACE/run-a15-step.py"

      - name: Prove baseline has no root framework
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Prove baseline has no root framework'

      - name: Rebuild the already-proven Android 15 BPF baseline
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Apply article prerequisite and Android 15 BPF patch range'

      - name: Apply exact Android 16 donor delta on top of proven A15
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/bpf-apply.log") 2>&1

          echo '===== Normalize A15 helper-ID ABI to the exact donor A15 endpoint ====='
          # The proven A15 build only had to synthesize helper IDs through 68.
          # A16 commits were authored against the complete helper-ID table that
          # already existed at donor A15_LAST. Copy only that stable enum mapper;
          # this does not enable unsupported helpers by itself.
          git fetch --no-tags --depth=161 aresin "$A16_LAST"
          git cat-file -e "$A15_LAST^{commit}"
          git cat-file -e "$A16_FIRST^{commit}"
          git cat-file -e "$A16_LAST^{commit}"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('include/uapi/linux/bpf.h')
          local = p.read_text()
          donor = subprocess.check_output(
              ['git', 'show', 'bd379f8140acc083fc386cc2600ee205b2a54e31:include/uapi/linux/bpf.h'],
              text=True,
          )

          def mapper_span(s):
              a = s.index('#define __BPF_FUNC_MAPPER')
              b = s.index("/* integer value in 'imm'", a)
              return a, b

          la, lb = mapper_span(local)
          da, db = mapper_span(donor)
          local = local[:la] + donor[da:db] + local[lb:]
          p.write_text(local)
          PY
          git add include/uapi/linux/bpf.h
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'A15 prep: align stable BPF helper-ID ABI with donor endpoint'
          fi

          echo '===== Audit exact A16 range ====='
          mapfile -t A16_COMMITS < <(git rev-list --reverse "$A15_LAST..$A16_LAST")
          COUNT="${#A16_COMMITS[@]}"
          echo "A16 delta commits: $COUNT"
          test "$COUNT" -eq 160
          test "${A16_COMMITS[0]}" = "$A16_FIRST"
          test "${A16_COMMITS[159]}" = "$A16_LAST"
          for c in "${A16_COMMITS[@]}"; do
            git show -s --format='%h %s' "$c"
          done | tee "$GITHUB_WORKSPACE/a16-bpf-commit-list.txt"

          echo '===== Apply Android 16 delta in chronological order ====='
          for c in "${A16_COMMITS[@]}"; do
            echo ">>> $(git show -s --format='%h %s' "$c")"
            if git cherry-pick -x "$c"; then
              continue
            fi
            failed="$(git rev-parse CHERRY_PICK_HEAD 2>/dev/null || true)"
            echo '===== UNHANDLED A16 CHERRY-PICK FAILURE ====='
            echo "failed commit: $failed"
            git status --short || true
            echo '===== unresolved paths ====='
            git diff --name-only --diff-filter=U || true
            echo '===== conflict diff/check ====='
            git diff --check || true
            git diff || true
            if test -n "$failed"; then
              git show --stat --oneline "$failed" || true
            fi
            exit 1
          done

          echo '===== A16 post-apply audit ====='
          git diff --check
          test -f kernel/bpf/btf.c
          test -f include/linux/btf.h
          test -f include/uapi/linux/btf.h
          ! grep -r -n -E 'CONFIG_KSU|KernelSU|SukiSU|ReSukiSU|SUSFS' \
              --exclude-dir=.git \
              --include='Kconfig*' --include='Makefile' --include='*.mk' \
              --include='*.c' --include='*.h' --include='*.S' --include='*.config' .
          echo '[PASS] proven A15 baseline + exact 160-commit A16 donor delta applied; root frameworks absent'

      - name: Reconstruct pinned OPPO vendor tree
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Reconstruct pinned OPPO vendor tree'

      - name: Audit OPPO external symlinks
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Audit OPPO external symlinks'

      - name: Install host build dependencies
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Install host build dependencies'

      - name: Download and verify archived PCHM30 toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Download and verify archived PCHM30 toolchains'

      - name: Resolve and validate toolchains
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Resolve and validate toolchains'

      - name: Export proven PCHM30 build environment
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Export proven PCHM30 build environment'

      - name: Prepare stock config after A16 BPF backport
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Prepare stock config after BPF backport'

      - name: olddefconfig and audit BPF config
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'olddefconfig and audit BPF config'

      - name: Build rootless A16-BPF kernel
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Build rootless A15-BPF kernel'

      - name: Verify output
        if: success()
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-a15-step.py" 'Verify output'

      - name: Upload A16 BPF experiment diagnostics and Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-A16-BPF-ONLY-${{ github.run_number }}
          path: |
            bpf-apply.log
            a15-bpf-commit-list.txt
            a16-bpf-commit-list.txt
            build.log
            Image.sha256
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/.config
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: warn