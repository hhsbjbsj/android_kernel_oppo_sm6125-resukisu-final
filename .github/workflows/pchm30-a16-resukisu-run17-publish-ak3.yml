name: PCHM30 A16 ReSukiSU Run17 Publish AK3
# retrigger after workflow file already exists on artifact branch

on:
  push:
    branches: [pchm30-a16-resukisu-run17-ak3-artifact]
    paths:
      - '.github/workflows/pchm30-a16-resukisu-run17-publish-ak3.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-resukisu-run17-ak3-artifact
          fetch-depth: 1

      - name: Fetch latest successful ReSukiSU Run17 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: pchm30-a16-run17-btf-kprobe-fix
          SOURCE_WORKFLOW_NAME: PCHM30 A16 Run17 BTF Kprobe Fix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf fetched-run17 artifacts
          mkdir -p fetched-run17 artifacts

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['SOURCE_BRANCH']
          workflow_name = os.environ['SOURCE_WORKFLOW_NAME']
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'pchm30-run17-ak3-publisher',
          }

          def get_json(path):
              req = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def download(path, dest):
              req = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(req, timeout=180) as r, open(dest, 'wb') as f:
                  shutil.copyfileobj(r, f)

          runs = get_json(f'/repos/{repo}/actions/runs?branch={branch}&status=success&per_page=100').get('workflow_runs', [])
          runs = [r for r in runs if r.get('name') == workflow_name and r.get('conclusion') == 'success']
          if not runs:
              raise SystemExit('No successful ReSukiSU Run17 workflow run found')
          run = runs[0]
          run_id = run['id']
          run_number = run.get('run_number')
          head_sha = run.get('head_sha')

          arts = get_json(f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          arts = [a for a in arts if not a.get('expired') and a.get('name', '').startswith('PCHM30-A16-RUN17-BTF-KPROBE-FIX-')]
          if not arts:
              raise SystemExit(f'No non-expired Run17 artifact found for run {run_id}')
          art = arts[0]
          artifact_id = art['id']
          artifact_name = art['name']
          artifact_digest = art.get('digest', '')

          outer = Path('fetched-run17/source-artifact.zip')
          download(f'/repos/{repo}/actions/artifacts/{artifact_id}/zip', outer)
          with zipfile.ZipFile(outer) as z:
              z.extractall('fetched-run17/extracted')

          root = Path('fetched-run17/extracted')
          candidates = sorted([
              p for p in root.rglob('*.zip')
              if 'AK3' in p.name.upper() and 'RUN17' in p.name.upper()
          ])
          if not candidates:
              raise SystemExit('Successful Run17 artifact does not contain an AK3 zip')

          src = candidates[0]
          out = Path('artifacts/PCHM30-A16-ReSukiSU-RUN17-BTF-KPROBE-AK3.zip')
          shutil.copy2(src, out)
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path(str(out) + '.sha256').write_text(f'{sha}  {out.name}\n')

          source = Path('artifacts/SOURCE.txt')
          source.write_text(
              'PCHM30 A16 ReSukiSU Run17 AK3 artifact\n'
              f'source_branch={branch}\n'
              f'source_workflow={workflow_name}\n'
              f'source_run_id={run_id}\n'
              f'source_run_number={run_number}\n'
              f'source_head_sha={head_sha}\n'
              f'github_artifact_id={artifact_id}\n'
              f'github_artifact_name={artifact_name}\n'
              f'github_artifact_digest={artifact_digest}\n'
              f'original_ak3_name={src.name}\n'
              f'ak3_sha256={sha}\n'
              'root_method=ReSukiSU + SUSFS 2.2.0 (no KPM)\n'
              'features=BTF,KPROBES,KRETPROBES,Scene prerequisites,BBG,LZ4K,LZ4KD,built-in WiFi,built-in Audio\n'
          )

          readme = Path('README-RUN17-RESUKISU-AK3.md')
          readme.write_text(
              '# PCHM30 A16 ReSukiSU Run17 AK3\n\n'
              'This branch stores the flashable AnyKernel3 package recovered from the latest successful '
              '`pchm30-a16-run17-btf-kprobe-fix` GitHub Actions run.\n\n'
              '- Root implementation: ReSukiSU + SUSFS 2.2.0\n'
              '- KPM: disabled/not used\n'
              '- Preserved features: BTF, KPROBES/KRETPROBES, Scene prerequisites, BBG, LZ4K/LZ4KD, built-in Wi-Fi and Audio\n'
              f'- Source run: `{run_id}` (run number `{run_number}`)\n'
              f'- Source commit: `{head_sha}`\n'
              f'- AK3 SHA256: `{sha}`\n\n'
              'Flash `artifacts/PCHM30-A16-ReSukiSU-RUN17-BTF-KPROBE-AK3.zip` from a compatible recovery.\n'
          )

          print(f'[PASS] source run_id={run_id} run_number={run_number}')
          print(f'[PASS] artifact_id={artifact_id} name={artifact_name}')
          print(f'[PASS] original AK3={src}')
          print(f'[PASS] published AK3 sha256={sha}')
          PY

      - name: Commit AK3 product to artifact branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts README-RUN17-RESUKISU-AK3.md
          if git diff --cached --quiet; then
            echo '[PASS] artifact branch already up to date'
            exit 0
          fi
          git commit -m 'publish: ReSukiSU Run17 flashable AK3 artifact'
          git push origin HEAD:pchm30-a16-resukisu-run17-ak3-artifact
