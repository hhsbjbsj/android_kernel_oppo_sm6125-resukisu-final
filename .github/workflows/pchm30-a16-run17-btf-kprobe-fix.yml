name: PCHM30 A16 Run17 BTF Kprobe Fix

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run17-btf-kprobe-fix]
    paths:
      - '.github/workflows/pchm30-a16-run17-btf-kprobe-fix.yml'
      - '.github/scripts/run17-btf-kprobe-scene-fix.sh'

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: beaaea0eb895dc41e7b9bf5e3f39e57aa9635bab
  ROOT_SUCCESS_BRANCH: pchm30-a16-resukisu-susfs220
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  EXP1_BRANCH: pchm30-a16-btf-sockmap-exp1
  EXP1_WORKFLOW: .github/workflows/pchm30-a16-btf-sockmap-exp1-v2.yml
  WIFI_SUCCESS_BRANCH: pchm30-a16-wifi-abi-exp1
  WIFI_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-wifi-abi-exp1-build.yml
  EXP2_BRANCH: pchm30-a16-btf-exp2-diagnose
  EXP2_WORKFLOW: .github/workflows/pchm30-a16-btf-exp2-diagnose.yml
  UPSTREAM_BTF_UAPI: f063c889c9458354a92b235a51cbb60d30321070
  UPSTREAM_BTF_KERNEL: 1dc92851849cc2235a1efef8f8d5a9255efc5f13
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Run17 fixed - BTF sysfs + KPROBES + Scene prerequisites
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-bpf-only
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Install BTF host tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y dwarves binutils
          command -v pahole
          pahole --version
          command -v readelf
          command -v objcopy
          command -v objdump

      - name: Build Run17 with real vmlinux BTF and probe support
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/run16-orchestrate.sh" > "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-builtin-runtime-retry.sh" > "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-bbg-lz4kd.sh" > "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-btf-kprobe-scene-fix.sh" > "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"
          chmod +x \
            "$GITHUB_WORKSPACE/run17-orchestrate.sh" \
            "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh" \
            "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh" \
            "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'run17-orchestrate.sh'
          s = p.read_text()
          old = '"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n\nrun_step \'Instrument exact BTF rejection path\''
          new = ('"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"\n\n'
                 'run_step \'Instrument exact BTF rejection path\'')
          if old not in s:
              raise SystemExit('cannot locate Run16 staging call in orchestrator')
          p.write_text(s.replace(old, new, 1))
          PY

          "$GITHUB_WORKSPACE/run17-orchestrate.sh"

      - name: Hard verify Run17 BTF Kprobes and preserved runtime features
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          CONFIG="$OUT_DIR/.config"
          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$GITHUB_WORKSPACE/run16-builtin-proof.txt"
          test -s "$GITHUB_WORKSPACE/run17-builtin-runtime-proof.txt"
          test -s "$GITHUB_WORKSPACE/run17-bbg-zram-stage-proof.txt"
          test -s "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-stage-proof.txt"
          test ! -s "$GITHUB_WORKSPACE/run16-unwanted-ko.txt"

          for cfg in \
            CONFIG_QCA_CLD_WLAN=y \
            CONFIG_MSM_11AD=y \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_BPF=y \
            CONFIG_BPF_SYSCALL=y \
            CONFIG_BPF_JIT=y \
            CONFIG_CGROUP_BPF=y \
            CONFIG_BPF_STREAM_PARSER=y \
            CONFIG_DEBUG_INFO=y \
            CONFIG_DEBUG_INFO_BTF=y \
            CONFIG_KPROBES=y \
            CONFIG_KRETPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_PERF_EVENTS=y \
            CONFIG_BPF_EVENTS=y \
            CONFIG_MODVERSIONS=y \
            CONFIG_BBG=y \
            CONFIG_CRYPTO_LZ4K=y \
            CONFIG_CRYPTO_LZ4KD=y \
            CONFIG_LZ4K_COMPRESS=y \
            CONFIG_LZ4K_DECOMPRESS=y \
            CONFIG_LZ4KD_COMPRESS=y \
            CONFIG_LZ4KD_DECOMPRESS=y; do
            grep -qx "$cfg" "$CONFIG" || { echo "[FATAL] missing $cfg"; exit 81; }
          done
          ! grep -q '^CONFIG_KPM=y$' "$CONFIG"

          echo '===== FINAL VMLINUX BTF SECTION =====' | tee "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          readelf -SW "$VMLINUX" | grep -E '[[:space:]]\.BTF[[:space:]]' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          test "$(readelf -SW "$VMLINUX" | grep -Ec '[[:space:]]\.BTF[[:space:]]')" -eq 1
          objcopy --dump-section .BTF="$GITHUB_WORKSPACE/run17-vmlinux.btf" "$VMLINUX"
          test -s "$GITHUB_WORKSPACE/run17-vmlinux.btf"
          stat -c 'BTF raw bytes=%s' "$GITHUB_WORKSPACE/run17-vmlinux.btf" | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"

          echo '===== LINKED BTF SYSFS SYMBOLS =====' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          nm "$VMLINUX" | grep -E '_binary__btf_vmlinux_bin_(start|end)$' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          nm "$VMLINUX" | grep -Eq '[[:space:]]_binary__btf_vmlinux_bin_start$'
          nm "$VMLINUX" | grep -Eq '[[:space:]]_binary__btf_vmlinux_bin_end$'

          echo '===== KPROBE/KRETPROBE SYMBOLS =====' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          nm "$VMLINUX" | grep -E '[[:space:]](register_kprobe|register_kretprobe)$' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          nm "$VMLINUX" | grep -Eq '[[:space:]]register_kprobe$'
          nm "$VMLINUX" | grep -Eq '[[:space:]]register_kretprobe$'

          echo '===== SCENE TARGET SYSCALL SYMBOLS =====' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          nm "$VMLINUX" | grep -E '[[:space:]](sys_bind|SyS_bind|sys_getsockname|SyS_getsockname|sys_close|SyS_close)$' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"
          for sym in sys_bind sys_getsockname sys_close; do
            nm "$VMLINUX" | grep -Eq "[[:space:]]${sym}$" || { echo "[FATAL] missing ${sym}"; exit 82; }
          done

          for sym in \
            BPF_PROG_TYPE_CGROUP_SOCK_ADDR \
            BPF_CGROUP_INET4_BIND \
            BPF_CGROUP_INET6_BIND \
            BPF_CGROUP_INET4_CONNECT \
            BPF_CGROUP_INET6_CONNECT; do
            grep -q "$sym" include/uapi/linux/bpf.h || { echo "[FATAL] missing $sym"; exit 83; }
          done

          strings -a "$IMAGE" > "$GITHUB_WORKSPACE/run17-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 built-in WLAN delayed start armed' "$GITHUB_WORKSPACE/run17-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 built-in WLAN delayed start succeeded' "$GITHUB_WORKSPACE/run17-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 q6core active reprobe armed' "$GITHUB_WORKSPACE/run17-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 q6core active reprobe succeeded' "$GITHUB_WORKSPACE/run17-image-strings.txt"
          grep -Fq 'baseband_guard power by' "$GITHUB_WORKSPACE/run17-image-strings.txt"

          nm "$VMLINUX" > "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"
          grep -Eq '[[:space:]]hdd_driver_load$' "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"
          grep -Eq '[[:space:]]q6core_probe$' "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"
          grep -Eq '[[:space:]]bbg_init$' "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"
          grep -Eq '[[:space:]]lz4k_mod_init$' "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"
          grep -Eq '[[:space:]]lz4kd_mod_init$' "$GITHUB_WORKSPACE/run17-vmlinux-nm.txt"

          echo '[PASS] Run17 fixed image contains embedded BTF, sysfs BTF exporter, KPROBES/KRETPROBES and keeps prior Run17 features' | tee -a "$GITHUB_WORKSPACE/run17-btf-runtime-proof.txt"

      - name: Package reusable PCHM30 AnyKernel3 ZIP
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/package-pchm30-run17-ak3.sh" > "$GITHUB_WORKSPACE/package-pchm30-run17-ak3.sh"
          chmod +x "$GITHUB_WORKSPACE/package-pchm30-run17-ak3.sh"
          "$GITHUB_WORKSPACE/package-pchm30-run17-ak3.sh" \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-BTF-KPROBE-FIX-AK3-${GITHUB_RUN_NUMBER}.zip"
          cp -f "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-BTF-KPROBE-FIX-Image-${GITHUB_RUN_NUMBER}"

      - name: Upload Run17 BTF Kprobe fix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-A16-RUN17-BTF-KPROBE-FIX-${{ github.run_number }}
          path: |
            run16-builtin-stage.log
            run16-builtin-manifest.txt
            run16-builtin-proof.txt
            run16-unwanted-ko.txt
            run17-builtin-runtime.log
            run17-builtin-runtime-proof.txt
            run17-bbg-zram.log
            run17-bbg-zram-stage-proof.txt
            run17-btf-kprobe-scene-fix.log
            run17-btf-kprobe-scene-stage-proof.txt
            run17-btf-runtime-proof.txt
            run17-vmlinux.btf
            run17-image-strings.txt
            run17-vmlinux-nm.txt
            Image-run16-builtin.sha256
            Module.symvers.run16-builtin
            PCHM30-A16-RUN17-BTF-KPROBE-FIX-Image-${{ github.run_number }}
            PCHM30-A16-RUN17-BTF-KPROBE-FIX-AK3-${{ github.run_number }}.zip
            PCHM30-A16-RUN17-BTF-KPROBE-FIX-AK3-${{ github.run_number }}.zip.sha256
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/.config
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: warn
