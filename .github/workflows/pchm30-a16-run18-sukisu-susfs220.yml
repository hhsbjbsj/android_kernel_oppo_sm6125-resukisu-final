name: PCHM30 A16 Run18 SukiSU SUSFS 2.2.0

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run18-sukisu-susfs220]
    paths:
      - '.github/workflows/pchm30-a16-run18-sukisu-susfs220.yml'
      - '.github/scripts/run18-sukisu-swap.sh'
      - '.github/scripts/run17-builtin-runtime-retry.sh'
      - '.github/scripts/run17-bbg-lz4kd.sh'
      - '.github/scripts/run16-orchestrate.sh'
      - '.github/scripts/package-pchm30-run17-ak3.sh'

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: beaaea0eb895dc41e7b9bf5e3f39e57aa9635bab
  ROOT_SUCCESS_BRANCH: pchm30-a16-resukisu-susfs220
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  EXP1_BRANCH: pchm30-a16-btf-sockmap-exp1
  EXP1_WORKFLOW: .github/workflows/pchm30-a16-btf-sockmap-exp1-v2.yml
  WIFI_SUCCESS_BRANCH: pchm30-a16-wifi-abi-exp1
  WIFI_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-wifi-abi-exp1-build.yml
  EXP2_BRANCH: pchm30-a16-btf-exp2-diagnose
  EXP2_WORKFLOW: .github/workflows/pchm30-a16-btf-exp2-diagnose.yml
  UPSTREAM_BTF_UAPI: f063c889c9458354a92b235a51cbb60d30321070
  UPSTREAM_BTF_KERNEL: 1dc92851849cc2235a1efef8f8d5a9255efc5f13
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_COMMIT: b1d534bc41941b2c818d7a1a1dac341e4aabfc2d
  SUKISU_COMPAT_SOURCE_COMMIT: a8f57213e7f1897914d5ec205741464342c6f0aa
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Run18 - Run17 stack plus SukiSU and SUSFS 2.2.0
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-bpf-only
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Build Run18 from Run17 baseline with SukiSU core
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/run16-orchestrate.sh" > "$GITHUB_WORKSPACE/run18-orchestrate.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-builtin-runtime-retry.sh" > "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-bbg-lz4kd.sh" > "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"
          git show "$GITHUB_SHA:.github/scripts/run18-sukisu-swap.sh" > "$GITHUB_WORKSPACE/run18-sukisu-swap.sh"
          chmod +x \
            "$GITHUB_WORKSPACE/run18-orchestrate.sh" \
            "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh" \
            "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh" \
            "$GITHUB_WORKSPACE/run18-sukisu-swap.sh"

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ['GITHUB_WORKSPACE']) / 'run18-orchestrate.sh'
          s = p.read_text()

          old_root = (
              "run_step 'Prepare proven A16 root config'\n"
              "run_step 'Enable BPF stream parser for sockmap sockhash'\n"
          )
          new_root = (
              "run_step 'Prepare proven A16 root config'\n"
              '"$GITHUB_WORKSPACE/run18-sukisu-swap.sh"\n'
              "run_step 'Enable BPF stream parser for sockmap sockhash'\n"
          )
          if s.count(old_root) != 1:
              raise SystemExit(f'cannot locate root-config insertion point: {s.count(old_root)}')
          s = s.replace(old_root, new_root, 1)

          old_runtime = (
              '"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n\n'
              "run_step 'Instrument exact BTF rejection path'"
          )
          new_runtime = (
              '"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n'
              '"$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"\n'
              '"$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"\n\n'
              "run_step 'Instrument exact BTF rejection path'"
          )
          if s.count(old_runtime) != 1:
              raise SystemExit(f'cannot locate Run16 staging call: {s.count(old_runtime)}')
          s = s.replace(old_runtime, new_runtime, 1)
          p.write_text(s)
          PY

          grep -n 'run18-sukisu-swap' "$GITHUB_WORKSPACE/run18-orchestrate.sh"
          grep -n 'run17-bbg-lz4kd' "$GITHUB_WORKSPACE/run18-orchestrate.sh"
          "$GITHUB_WORKSPACE/run18-orchestrate.sh"

      - name: Verify Run18 SukiSU, SUSFS and Run17 features
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$GITHUB_WORKSPACE/run18-sukisu-proof.txt"
          test -s "$GITHUB_WORKSPACE/run18-sukisu-swap.log"
          test -s "$GITHUB_WORKSPACE/run16-builtin-proof.txt"
          test -s "$GITHUB_WORKSPACE/run17-builtin-runtime-proof.txt"
          test -s "$GITHUB_WORKSPACE/run17-bbg-zram-stage-proof.txt"
          test ! -s "$GITHUB_WORKSPACE/run16-unwanted-ko.txt"

          grep -Fxq "sukisu_commit=$SUKISU_COMMIT" "$GITHUB_WORKSPACE/run18-sukisu-proof.txt"
          grep -Fxq 'susfs_version=v2.2.0' "$GITHUB_WORKSPACE/run18-sukisu-proof.txt"
          grep -Fxq 'kpm=disabled' "$GITHUB_WORKSPACE/run18-sukisu-proof.txt"
          grep -Fq '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"
          test "$(git -C KernelSU remote get-url origin)" = "$SUKISU_REPO"

          grep -q '^CONFIG_QCA_CLD_WLAN=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MSM_11AD=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_BPF_STREAM_PARSER=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MODVERSIONS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_BBG=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_CRYPTO_LZ4K=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_CRYPTO_LZ4KD=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LZ4K_COMPRESS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LZ4K_DECOMPRESS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LZ4KD_COMPRESS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LZ4KD_DECOMPRESS=y$' "$OUT_DIR/.config"
          ! grep -q '^CONFIG_KPM=y$' "$OUT_DIR/.config"

          strings -a "$IMAGE" > "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 built-in WLAN delayed start armed' "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 built-in WLAN delayed start succeeded' "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 q6core active reprobe armed' "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'PCHM30 RUN17 q6core active reprobe succeeded' "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'baseband_guard power by' "$GITHUB_WORKSPACE/run18-image-strings.txt"
          grep -Fq 'manager spawn zygote SID mismatch' "$GITHUB_WORKSPACE/run18-image-strings.txt"

          nm "$VMLINUX" > "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]hdd_driver_load$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]q6core_probe$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]pchm30_builtin_wlan_start_workfn$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]pchm30_q6core_retry_workfn$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]bbg_init$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]lz4k_mod_init$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]lz4kd_mod_init$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"
          grep -Eq '[[:space:]]ksu_handle_setresuid$' "$GITHUB_WORKSPACE/run18-vmlinux-nm.txt"

          grep -Fq 'default_compressor = "lz4kd"' drivers/block/zram/zram_drv.c
          echo '[PASS] Run18 = Run17 BPF/built-ins/BBG/LZ4KD + SukiSU core + SUSFS 2.2.0; KPM disabled'

      - name: Package reusable PCHM30 Run18 AnyKernel3 ZIP
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/package-pchm30-run17-ak3.sh" > "$GITHUB_WORKSPACE/package-pchm30-run18-ak3.sh"
          chmod +x "$GITHUB_WORKSPACE/package-pchm30-run18-ak3.sh"
          "$GITHUB_WORKSPACE/package-pchm30-run18-ak3.sh" \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN18-SUKISU-SUSFS220-AK3-${GITHUB_RUN_NUMBER}.zip"
          cp -f "$OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/PCHM30-A16-RUN18-SUKISU-Image-${GITHUB_RUN_NUMBER}"

      - name: Upload Run18 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-A16-RUN18-SUKISU-SUSFS220-${{ github.run_number }}
          path: |
            run18-sukisu-swap.log
            run18-sukisu-proof.txt
            sukisu-builtin-4.14-compat.patch
            run16-builtin-stage.log
            run16-builtin-manifest.txt
            run16-builtin-proof.txt
            run16-unwanted-ko.txt
            run17-builtin-runtime.log
            run17-builtin-runtime-proof.txt
            run17-bbg-zram.log
            run17-bbg-zram-stage-proof.txt
            run18-image-strings.txt
            run18-vmlinux-nm.txt
            Image-run16-builtin.sha256
            Module.symvers.run16-builtin
            PCHM30-A16-RUN18-SUKISU-Image-${{ github.run_number }}
            PCHM30-A16-RUN18-SUKISU-SUSFS220-AK3-${{ github.run_number }}.zip
            PCHM30-A16-RUN18-SUKISU-SUSFS220-AK3-${{ github.run_number }}.zip.sha256
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/.config
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: warn
