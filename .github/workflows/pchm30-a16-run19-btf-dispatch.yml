name: PCHM30 Run19 BTF Dispatch

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run19-btf-kprobe-fix]
    paths:
      - '.github/workflows/pchm30-a16-run19-btf-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Run19 BTF Kprobe build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: pchm30-a16-run19-btf-kprobe-fix
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/pchm30-a16-run19-btf-kprobe-fix.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo '[PASS] dispatched Run19 BTF/Kprobe build'
