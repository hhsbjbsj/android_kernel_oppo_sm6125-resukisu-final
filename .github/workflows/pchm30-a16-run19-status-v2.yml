name: PCHM30 Run19 Status V2

on:
  push:
    branches: [pchm30-a16-run19-btf-kprobe-fix]
    paths:
      - '.github/workflows/pchm30-a16-run19-status-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pchm30-a16-run19-btf-kprobe-fix
          fetch-depth: 0
      - name: Save latest Run19 BTF run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-diagnostics
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/pchm30-a16-run19-btf-kprobe-fix.yml/runs?branch=pchm30-a16-run19-btf-kprobe-fix&per_page=3' \
            -o /tmp/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'))
          runs=d.get('workflow_runs',[])
          out=[]
          for r in runs[:3]:
              out.append(f"run_id={r['id']} status={r['status']} conclusion={r.get('conclusion') or ''} head_sha={r['head_sha']} event={r['event']} created_at={r['created_at']} url={r['html_url']}")
          Path('ci-diagnostics/run19-btf-status-v2.txt').write_text('\n'.join(out)+'\n')
          PY
          cat ci-diagnostics/run19-btf-status-v2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-diagnostics/run19-btf-status-v2.txt
          git commit -m 'ci: snapshot latest Run19 BTF status' || exit 0
          git push origin HEAD:pchm30-a16-run19-btf-kprobe-fix
