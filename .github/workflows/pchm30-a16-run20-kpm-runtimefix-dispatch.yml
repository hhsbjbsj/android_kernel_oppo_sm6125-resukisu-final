name: PCHM30 A16 Run20 KPM Runtime Fix Dispatch

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run20-kpm-runtimefix]
    paths:
      - '.github/workflows/pchm30-a16-run20-kpm-runtimefix-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch proven Run19 build pipeline on Run20 ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: pchm30-a16-run20-kpm-runtimefix
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/pchm30-a16-run19-kpm-exp1.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo "[PASS] dispatched proven KPM build pipeline at $REF"
