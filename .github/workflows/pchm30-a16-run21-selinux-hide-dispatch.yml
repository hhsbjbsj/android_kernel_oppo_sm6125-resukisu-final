name: PCHM30 A16 Run21 SELinux Hide Dispatch

# Manual trigger 2026-08-18 after adding bounded apt mirror retries/timeouts.
on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run21-selinux-hide]
    paths:
      - '.github/workflows/pchm30-a16-run21-selinux-hide-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch proven Run20 pipeline on Run21 ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: pchm30-a16-run21-selinux-hide
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/pchm30-a16-run19-kpm-exp1.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo "[PASS] dispatched proven Run20-equivalent pipeline at $REF with Run21 SELinux-hide stage"
