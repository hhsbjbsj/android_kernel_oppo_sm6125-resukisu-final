name: PCHM30 A16 Run23 Diagnose
# status refresh after SIGPIPE fix

on:
  push:
    branches: [pchm30-a16-run23-kpm-runtimefix-btf]
    paths:
      - '.github/workflows/pchm30-a16-run23-diagnose.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pchm30-a16-run23-kpm-runtimefix-btf
          fetch-depth: 1

      - name: Capture current Run23 status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'run23-status'}
          def get(path):
              req=urllib.request.Request('https://api.github.com'+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          runs=get(f'/repos/{repo}/actions/runs?branch=pchm30-a16-run23-kpm-runtimefix-btf&per_page=20')['workflow_runs']
          runs=[r for r in runs if r.get('name')=='PCHM30 A16 Run23 KPM RuntimeFix + BTF Kprobe']
          out=['===== RUN23 STATUS REFRESH =====']
          for r in runs[:10]:
              out.append(f"run_id={r['id']} run_number={r.get('run_number')} status={r.get('status')} conclusion={r.get('conclusion')} sha={r.get('head_sha')} created={r.get('created_at')} updated={r.get('updated_at')}")
              if r.get('status') in ('queued','in_progress'):
                  jobs=get(f"/repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100").get('jobs',[])
                  for j in jobs:
                      out.append(f"  job_id={j['id']} status={j.get('status')} conclusion={j.get('conclusion')}")
                      for s in j.get('steps',[]):
                          if s.get('status') in ('in_progress','queued','pending') or s.get('conclusion')=='failure':
                              out.append(f"    step#{s.get('number')} {s.get('name')} status={s.get('status')} conclusion={s.get('conclusion')}")
          Path('run23-status-latest.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

      - name: Commit status report
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run23-status-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'run23: refresh current Actions status'
          git push origin HEAD:pchm30-a16-run23-kpm-runtimefix-btf
