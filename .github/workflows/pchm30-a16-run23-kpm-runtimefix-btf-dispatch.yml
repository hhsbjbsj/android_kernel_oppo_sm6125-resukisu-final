name: PCHM30 A16 Run23 KPM RuntimeFix BTF Dispatch

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run23-kpm-runtimefix-btf]
    paths:
      - '.github/workflows/pchm30-a16-run23-kpm-runtimefix-btf-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Run23 main build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: pchm30-a16-run23-kpm-runtimefix-btf
          WF: pchm30-a16-run23-kpm-runtimefix-btf.yml
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo '[PASS] Run23 main build dispatched'
