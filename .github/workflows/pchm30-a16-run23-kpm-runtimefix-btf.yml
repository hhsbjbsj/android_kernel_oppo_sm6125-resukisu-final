name: PCHM30 A16 SukiSU Run23 Publish Artifact

on:
  push:
    branches: [pchm30-a16-sukisu-run23-ak3-artifact]
    paths:
      - '.github/workflows/pchm30-a16-run23-kpm-runtimefix-btf.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout Run23 artifact branch
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-sukisu-run23-ak3-artifact
          fetch-depth: 1

      - name: Recover exact successful Run23 AK3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: '9337439851'
          EXPECTED_AK3_SHA256: '79affeb902789af760bd422ab4be6184b0b29313b7c8fae77544b3360916baa2'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/run23-product artifacts
          mkdir -p /tmp/run23-product artifacts
          python3 - <<'PY'
          import hashlib, os, shutil, urllib.request, zipfile
          from pathlib import Path

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          artifact_id=os.environ['ARTIFACT_ID']
          expected=os.environ['EXPECTED_AK3_SHA256']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {token}',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'pchm30-run23-product-publisher',
              }
          )
          outer=Path('/tmp/run23-product/artifact.zip')
          with urllib.request.urlopen(req, timeout=180) as r, outer.open('wb') as f:
              shutil.copyfileobj(r,f)
          with zipfile.ZipFile(outer) as z:
              z.extractall('/tmp/run23-product/extracted')

          root=Path('/tmp/run23-product/extracted')
          src=root/'PCHM30-A16-RUN19-KPM-SUKISU-SUSFS220-AK3-5.zip'
          if not src.is_file():
              raise SystemExit(f'AK3 not found: {src}')
          sha=hashlib.sha256(src.read_bytes()).hexdigest()
          if sha != expected:
              raise SystemExit(f'AK3 SHA256 mismatch: {sha} != {expected}')

          dst=Path('artifacts/PCHM30-A16-SukiSU-RUN23-KPM-RUNTIMEFIX-BTF-AK3.zip')
          shutil.copy2(src,dst)
          Path(str(dst)+'.sha256').write_text(f'{sha}  {dst.name}\n')
          Path('artifacts/SOURCE.txt').write_text(
              'PCHM30 A16 SukiSU Run23 verified artifact\n'
              'source_branch=pchm30-a16-run23-kpm-runtimefix-btf\n'
              'source_workflow=PCHM30 A16 Run23 KPM RuntimeFix + BTF Kprobe\n'
              'source_run_id=32165962039\n'
              'source_run_number=5\n'
              'source_head_sha=64d77ea102b168372067d8e651e8d7178a198201\n'
              'github_artifact_id=9337439851\n'
              'github_artifact_name=PCHM30-A16-RUN23-KPM-RUNTIMEFIX-BTF-5\n'
              'github_artifact_digest=sha256:522750aa93986b13bd9505a584cb99ba590ca9921bd61abaaf9b83eb74de9bb7\n'
              'original_ak3_name=PCHM30-A16-RUN19-KPM-SUKISU-SUSFS220-AK3-5.zip\n'
              f'ak3_size_bytes={dst.stat().st_size}\n'
              f'ak3_sha256={sha}\n'
              'root_method=SukiSU Ultra + SUSFS 2.2.0 + KPM runtimefix\n'
              'features=KPM runtimefix,BTF,KPROBES,KRETPROBES,Scene prerequisites,BBG,LZ4K,LZ4KD,built-in WiFi,built-in Audio\n'
              'device_validation=PASS; KPM load ENTER/EXIT and list ENTER/EXIT observed; Manager remained responsive\n'
          )
          Path('README-RUN23-SUKISU-AK3.md').write_text(
              '# PCHM30 A16 SukiSU Run23 verified AK3\n\n'
              'This branch stores the flashable AnyKernel3 package from the successful and device-validated Run23 #5 build.\n\n'
              '- Root: SukiSU Ultra + SUSFS 2.2.0\n'
              '- KPM: enabled with the Run20/Run23 4.14 runtime fix\n'
              '- Source run: `32165962039` / run number `5`\n'
              '- Source commit: `64d77ea102b168372067d8e651e8d7178a198201`\n'
              '- GitHub artifact: `PCHM30-A16-RUN23-KPM-RUNTIMEFIX-BTF-5`\n'
              f'- AK3 SHA256: `{sha}`\n'
              '- Device validation: KPM LOAD/LIST ENTER+EXIT observed and SukiSU Manager remained responsive\n\n'
              'Flash file: `artifacts/PCHM30-A16-SukiSU-RUN23-KPM-RUNTIMEFIX-BTF-AK3.zip`\n'
          )
          print(f'[PASS] recovered Run23 AK3 sha256={sha}')
          print(f'[PASS] size={dst.stat().st_size}')
          PY

      - name: Commit verified Run23 product to artifact branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts README-RUN23-SUKISU-AK3.md
          git commit -m 'publish: verified SukiSU Run23 AK3 artifact'
          git push origin HEAD:pchm30-a16-sukisu-run23-ak3-artifact
