name: PCHM30 A16 Run24 SELinux Hide + KPM RuntimeFix BTF
# Registered on main so Actions can see it. The job only runs from pchm30-a16-run24-selinux-hide.

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run24-selinux-hide]
    paths:
      - '.github/workflows/pchm30-a16-run24-selinux-hide.yml'
      - '.github/workflows/pchm30-a16-run19-kpm-exp1.yml'
      - '.github/scripts/run16-orchestrate.sh'
      - '.github/scripts/run18-sukisu-swap.sh'
      - '.github/patches/sukisu-builtin-4.14-compat.patch'
      - '.github/scripts/run19-kpm-enable.sh'
      - '.github/scripts/run24-selinux-hide-compat.sh'

jobs:
  noop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Workflow registered
        run: echo 'Run24 workflow is registered on main; real build lives on pchm30-a16-run24-selinux-hide'
