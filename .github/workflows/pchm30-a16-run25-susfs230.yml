name: PCHM30 A16 Run25 SUSFS 2.3.0
# Run25: keep Run24 ReSukiSU/SukiSU line; adapt SUSFS 2.2.0 -> 2.3.0 in CI only.

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run25-susfs230]
    paths:
      - '.github/workflows/pchm30-a16-run25-susfs230.yml'
      - '.github/workflows/pchm30-a16-run24-selinux-hide.yml'
      - '.github/workflows/pchm30-a16-run19-kpm-exp1.yml'
      - '.github/scripts/run18-sukisu-swap.sh'
      - '.github/scripts/run19-kpm-enable.sh'
      - '.github/scripts/run24-selinux-hide-compat.sh'
      - '.github/scripts/run25-susfs230-adapt.sh'

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: beaaea0eb895dc41e7b9bf5e3f39e57aa9635bab
  ROOT_SUCCESS_BRANCH: pchm30-a16-resukisu-susfs220
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_COMMIT: 5a2bb7e5813002ccaabe02fa864cfb2dde6b5109
  SUKISU_BRANCH: builtin
  SUKISU_COMPAT_SOURCE_COMMIT: a8f57213e7f1897914d5ec205741464342c6f0aa
  SUKISU_PATCH_REPO: https://github.com/SukiSU-Ultra/SukiSU_patch.git
  SUKISU_PATCH_COMMIT: 547ae94bcaec53d030398f857950c64662043a5d
  RUN24_SOURCE_BRANCH: pchm30-a16-run25-susfs230
  RUN24_SOURCE_WORKFLOW: .github/workflows/pchm30-a16-run24-selinux-hide.yml
  RUN19_SOURCE_BRANCH: pchm30-a16-run25-susfs230
  RUN19_SOURCE_WORKFLOW: .github/workflows/pchm30-a16-run19-kpm-exp1.yml
  RUN17_BTF_FIX_COMMIT: bc983ae72d5795d0ec2a5b5dd4292dfab1417e57
  KPM_RUNTIMEFIX_COMMIT: a82515ffbe2e02e9b2f34c0616be9d64c7daa417
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Run25 SUSFS 2.3.0 on Run24 ReSukiSU/SukiSU stack
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-bpf-only
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Materialize Run24 runner and retarget SUSFS checks to 2.3.0
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$RUN24_SOURCE_BRANCH"
          git show "$GITHUB_SHA:$RUN24_SOURCE_WORKFLOW" > "$GITHUB_WORKSPACE/run24-source.yml"
          git show "$GITHUB_SHA:$RUN19_SOURCE_WORKFLOW" > "$GITHUB_WORKSPACE/run19-source.yml"
          sed -i 's/v2\.2\.0/v2.3.0/g' "$GITHUB_WORKSPACE/run19-source.yml"
          grep -Fq 'susfs_version=v2.3.0' "$GITHUB_WORKSPACE/run19-source.yml"
          grep -Fq 'SUSFS_VERSION "v2.3.0"' "$GITHUB_WORKSPACE/run19-source.yml"
          ! grep -Fq 'v2.2.0' "$GITHUB_WORKSPACE/run19-source.yml"
          cat > "$GITHUB_WORKSPACE/run-run24-step.py" <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          if len(sys.argv) != 2:
              raise SystemExit('usage: run-run24-step.py <step name>')
          name = sys.argv[1]
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          lines = (workspace / 'run24-source.yml').read_text().splitlines(True)
          marker = f'      - name: {name}\n'
          try:
              start = lines.index(marker)
          except ValueError:
              raise SystemExit(f'Run24 step not found: {name}')
          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].startswith('      - name: '):
                  end = i
                  break
          block = lines[start:end]
          workdir = None
          run_index = None
          inline_script = None
          for i, line in enumerate(block):
              if line.startswith('        working-directory: '):
                  workdir = line.split(': ', 1)[1].strip()
              if line.startswith('        run: '):
                  value = line.split(': ', 1)[1].rstrip('\n')
                  if value in ('|', '|-', '|+', '>', '>-', '>+'):
                      run_index = i + 1
                  else:
                      inline_script = value
                  break
          if inline_script is None and run_index is None:
              raise SystemExit(f'Run24 step is not shell: {name}')
          if inline_script is not None:
              script = inline_script + '\n'
          else:
              script_lines = []
              for line in block[run_index:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif line.strip() == '':
                      script_lines.append('\n')
                  else:
                      raise SystemExit(f'unexpected indentation: {line!r}')
              script = ''.join(script_lines)
          cwd = workspace / workdir if workdir else workspace
          print(f'===== REUSE RUN24 STEP: {name} =====', flush=True)
          subprocess.run(['bash', '-c', 'set -Eeuo pipefail\n' + script], cwd=cwd, check=True, env=os.environ.copy())
          PY
          python3 -m py_compile "$GITHUB_WORKSPACE/run-run24-step.py"
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Install BTF host tooling without Azure mirror hang'
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Hard gate proven KPM runtime-fix ancestry'
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Prepare proven KPM step runner from Run23 ref'
          sed -i 's/v2\.2\.0/v2.3.0/g' "$GITHUB_WORKSPACE/run19-source.yml"
          grep -Fq 'SUSFS_VERSION "v2.3.0"' "$GITHUB_WORKSPACE/run19-source.yml"
          test -f "$GITHUB_WORKSPACE/run-run19-step.py"

      - name: Build Run24 stack with SUSFS 2.3.0 adapter
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/run-run19-step.py" 'Build Run19 from proven Run18 stack with KPM compiled in'

      - name: Verify generated source and SUSFS 2.3.0
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'susfs_to=v2.3.0' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'official_4.14_2.3_patch=absent' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -Fq '#define TIF_PROC_NO_SU 34' include/linux/susfs_def.h
          grep -Fq '#define TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT 35' include/linux/susfs_def.h
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Verify KPM runtime fix reached generated source'

      - name: Apply Run17 BTF Kprobe fix, verify, patch and package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Apply successful Run17 BTF Kprobe fix and relink'
          python3 "$GITHUB_WORKSPACE/run-run19-step.py" 'Verify compiled KPM and all proven Run18 features'
          python3 "$GITHUB_WORKSPACE/run-run24-step.py" 'Hard verify BTF Kprobes Scene and KPM runtimefix together'
          python3 "$GITHUB_WORKSPACE/run-run19-step.py" 'Patch final Image with pinned SukiSU KPM patcher'
          python3 "$GITHUB_WORKSPACE/run-run19-step.py" 'Package reusable PCHM30 Run19 KPM AnyKernel3 ZIP'
          grep -Fq '#define SUSFS_VERSION "v2.3.0"' "$GITHUB_WORKSPACE/$KERNEL_REL/include/linux/susfs.h"
          echo '[PASS] Run25 compiled the Run24 ReSukiSU/SukiSU line with SUSFS 2.3.0'

      - name: Upload Run25 SUSFS 2.3.0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-A16-RUN25-SUSFS230-${{ github.run_number }}
          path: |
            run25-susfs230-adapt.log
            run25-susfs230-proof.txt
            run25-official-4.14-susfs.h
            run25-official-4.14-50_add_susfs.patch
            run24-selinux-hide-compat.log
            run24-selinux-hide-proof.txt
            run23-kpm-runtimefix-base-proof.txt
            run23-kpm-runtimefix-source-proof.txt
            run18-sukisu-swap.log
            run18-sukisu-proof.txt
            run19-kpm-enable.log
            run19-kpm-config-proof.txt
            run19-kpm-patcher.log
            run19-kpm-final-proof.txt
            run17-bbg-zram-stage-proof.txt
            run17-btf-kprobe-scene-stage-proof.txt
            run23-btf-kprobe-proof.txt
            PCHM30-A16-RUN19-KPM-SUKISU-SUSFS220-AK3-${{ github.run_number }}.zip
            PCHM30-A16-RUN19-KPM-SUKISU-SUSFS220-AK3-${{ github.run_number }}.zip.sha256
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/.config
            source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: warn
