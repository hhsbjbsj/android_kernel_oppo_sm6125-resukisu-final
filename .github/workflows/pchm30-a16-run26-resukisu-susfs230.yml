name: PCHM30 OpenELA source integration build
# ReSukiSU line from Run17. Keep in-tree 4.14 susfs.c + 4.14 VFS ABI. KPM stays off.
# ReSukiSU: pinned to the exact revision used by Run 64 for reproducibility.
# BPF verifier hardening: pinned Linux 4.14.236 stable series, excluding the
# unrelated and broken hashtab changes from LF-Repo 013514ce.
# Xiaomi full dependency chain: MAP_FREEZE, lookup-delete, queue/stack,
# BTF next-id, JMP32 and bounded loops.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Kernel source scope
        type: choice
        options: [direct357, stable200, stable190, point-release, full]
        default: direct357
  push:
    branches: [pchm30-openela-414357-integration]
    paths:
      - '.github/workflows/pchm30-a16-run26-resukisu-susfs230.yml'
      - '.github/scripts/apply-kernel-414357.sh'
      - '.github/scripts/apply-kernel-414190.sh'
      - '.github/scripts/apply-kernel-414200.sh'
      - '.github/patches/resolve-4.14.200-pchm30.patch'
      - '.github/scripts/apply-openela-357-fixes.sh'

concurrency:
  group: pchm30-openela-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9
  OPENELA_COMPILE_CANDIDATE: '1'
  RUN152_SOURCE_REF: f3b4ee6a48a03a67ece3b6699d3e07b4f278dca8
  RUN191_SOURCE_REF: 4b792a0a141744d05c5937e01da820888e430228
  RUN194_ARCHIVE_REF: b9fbbe85263c4a64615dac68addf755a8ab573f5
  RUN197_ARCHIVE_REF: e55856b8ab006f49621d3f9483bb0988d3585346
  ROOT_SUCCESS_BRANCH: pchm30-a16-resukisu-susfs220
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  EXP1_BRANCH: pchm30-a16-btf-sockmap-exp1
  EXP1_WORKFLOW: .github/workflows/pchm30-a16-btf-sockmap-exp1-v2.yml
  WIFI_SUCCESS_BRANCH: pchm30-a16-wifi-abi-exp1
  WIFI_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-wifi-abi-exp1-build.yml
  EXP2_BRANCH: pchm30-a16-btf-exp2-diagnose
  EXP2_WORKFLOW: .github/workflows/pchm30-a16-btf-exp2-diagnose.yml
  UPSTREAM_BTF_UAPI: f063c889c9458354a92b235a51cbb60d30321070
  UPSTREAM_BTF_KERNEL: 1dc92851849cc2235a1efef8f8d5a9255efc5f13
  RUN17_BTF_FIX_COMMIT: bc983ae72d5795d0ec2a5b5dd4292dfab1417e57
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Compile PCHM30 OpenELA ${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        scope: ["${{ inputs.scope || 'direct357' }}"]
    env:
      OPENELA_SCOPE: ${{ matrix.scope }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop superseded integration builds
        if: github.event_name == 'push' && matrix.scope == 'full'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'pchm30-a16-run26-resukisu-susfs230.yml',
              branch: 'pchm30-openela-414357-integration',
              per_page: 100
            });
            for (const run of response.data.workflow_runs) {
              if (run.id === context.runId || run.run_number >= context.runNumber) continue;
              if (!['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info('Stopped superseded integration run ' + run.run_number);
              } catch (error) {
                if (![409, 422].includes(error.status)) throw error;
              }
            }
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: 0789fcca2cbcb74143492a70afc6c3b5a59251b7
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Fetch the phone-tested Run 152 reference image
        if: matrix.scope == 'point-release'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41267234453
          name: PCHM30-A16-RUN26-RESUKISU-SUSFS230-414357-152
          path: run152-reference

      - name: Fetch the phone-tested Run 191 reference image
        if: matrix.scope == 'stable190'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42959134812
          name: PCHM30-OpenELA-point-release-191
          path: run191-reference

      - name: Fetch the phone-tested Run 194 reference image
        if: matrix.scope == 'stable200'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42963068114
          name: PCHM30-OpenELA-stable190-194
          path: run194-reference

      - name: Fetch the phone-tested Run 197 reference image
        if: matrix.scope == 'direct357'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42973424849
          name: PCHM30-OpenELA-stable200-197
          path: run197-reference

      - name: Install BTF host tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y dwarves binutils ccache
          pahole --version
          ccache --version

      - name: Setup ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref }}-
            kernel-ccache-${{ runner.os }}-${{ github.workflow }}-

      - name: Build Run17 ReSukiSU stack with SUSFS 2.3 overlay and KPM off
        working-directory: source/android/kernel/msm-4.14
        env:
          MAKEFLAGS: ${{ (matrix.scope == 'full' || matrix.scope == 'stable200' || matrix.scope == 'direct357') && '-k' || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$RUN17_BTF_FIX_COMMIT"
          source_ref="$GITHUB_SHA"
          if [ "$OPENELA_SCOPE" != full ]; then
            source_ref="$RUN152_SOURCE_REF"
            git fetch --no-tags --depth=1 origin "$source_ref"
          fi
          git show "$source_ref:.github/scripts/run16-orchestrate.sh" > "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          git show "$source_ref:.github/scripts/run17-builtin-runtime-retry.sh" > "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"
          git show "$source_ref:.github/scripts/run17-bbg-lz4kd.sh" > "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"
          git show "$source_ref:.github/scripts/run25-susfs230-adapt.sh" > "$GITHUB_WORKSPACE/run25-susfs230-adapt.sh"
          git show "$source_ref:.github/scripts/run26-disable-kpm.sh" > "$GITHUB_WORKSPACE/run26-disable-kpm.sh"
          git show "$source_ref:.github/scripts/rewrite-susfs230-hooks.py" > "$GITHUB_WORKSPACE/rewrite-susfs230-hooks.py"
          git show "$source_ref:.github/scripts/adapt-ksu-sucompat230.sh" > "$GITHUB_WORKSPACE/adapt-ksu-sucompat230.sh"
          git show "$source_ref:.github/scripts/run28-extra-features.sh" > "$GITHUB_WORKSPACE/run28-extra-features.sh"
          git show "$source_ref:.github/scripts/run29-manager-handshake.sh" > "$GITHUB_WORKSPACE/run29-manager-handshake.sh"
          git show "$source_ref:.github/scripts/apply-binder-419-stability.sh" > "$GITHUB_WORKSPACE/apply-binder-419-stability.sh"
          git show "$source_ref:.github/scripts/apply-binder-los24-freeze.sh" > "$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh"
          git show "$source_ref:.github/scripts/apply-cgroup-v2-freezer.sh" > "$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh"
          git show "$source_ref:.github/scripts/apply-kernel-414186.sh" > "$GITHUB_WORKSPACE/apply-kernel-414186.sh"
          if [ "$OPENELA_SCOPE" != full ]; then
            point_ref="$GITHUB_SHA"
            if [[ "$OPENELA_SCOPE" = stable* || "$OPENELA_SCOPE" = direct357 ]]; then
              point_ref="$RUN191_SOURCE_REF"
              git fetch --no-tags --depth=1 origin "$point_ref"
            fi
            case "$OPENELA_SCOPE" in
              stable190)
                git show "$GITHUB_SHA:.github/scripts/apply-kernel-414190.sh" > "$GITHUB_WORKSPACE/apply-kernel-414190.sh"
                ;;
              stable200|direct357)
                git fetch --no-tags --depth=1 origin "$RUN194_ARCHIVE_REF"
                git show "$RUN194_ARCHIVE_REF:.github/patches/patch-4.14.186-to-190-pchm30.patch" > "$GITHUB_WORKSPACE/run194-4.14.190.patch"
                if [ "$OPENELA_SCOPE" = direct357 ]; then
                  git fetch --no-tags --depth=1 origin "$RUN197_ARCHIVE_REF"
                  git show "$RUN197_ARCHIVE_REF:.github/patches/patch-4.14.190-to-200-pchm30.patch" > "$GITHUB_WORKSPACE/run197-4.14.200.patch"
                  git show "$GITHUB_SHA:.github/scripts/apply-kernel-414357.sh" > "$GITHUB_WORKSPACE/apply-kernel-direct357.sh"
                else
                  git show "$GITHUB_SHA:.github/scripts/apply-kernel-414200.sh" > "$GITHUB_WORKSPACE/apply-kernel-414200.sh"
                  git show "$GITHUB_SHA:.github/patches/resolve-4.14.200-pchm30.patch" > "$GITHUB_WORKSPACE/resolve-4.14.200-pchm30.patch"
                fi
                ;;
            esac
            # Leave clock probing at the phone-tested baseline.
            git show "$point_ref:.github/scripts/apply-openela-357-fixes.sh" |
              sed '/^apply_group clock-devres /d' > "$GITHUB_WORKSPACE/apply-openela-357-fixes.sh"
            cat > "$GITHUB_WORKSPACE/apply-kernel-414357.sh" <<'BOOT_BASELINE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/$KERNEL_REL"
          report="$GITHUB_WORKSPACE/openela-report"
          mkdir -p "$report"
          boot_sources=(
            arch/arm64/kernel/head.S
            arch/arm64/kernel/setup.c
            arch/arm64/kernel/entry.S
            arch/arm64/kernel/cpu_errata.c
            arch/arm64/kernel/cpufeature.c
            arch/arm64/kernel/vmlinux.lds.S
            arch/arm64/mm/mmu.c
            arch/arm64/include/asm/fixmap.h
            drivers/of/fdt.c
            drivers/char/random.c
            drivers/soc/qcom/early_random.c
            drivers/clk/clk-devres.c
            include/linux/random.h
            init/main.c
            kernel/cpu.c
          )
          sha256sum "${boot_sources[@]}" > "$report/run152-boot-sources.sha256"
          bash "$GITHUB_WORKSPACE/apply-openela-357-fixes.sh"
          sha256sum -c "$report/run152-boot-sources.sha256"
          BOOT_BASELINE
          else
            git show "$GITHUB_SHA:.github/scripts/apply-kernel-414357.sh" > "$GITHUB_WORKSPACE/apply-kernel-414357.sh"
          fi
          git show "$source_ref:.github/patches/patch-4.14.180-to-186.patch" > "$GITHUB_WORKSPACE/patch-4.14.180-to-186.patch"
          git show "$RUN17_BTF_FIX_COMMIT:.github/scripts/run17-btf-kprobe-scene-fix.sh" > "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"
          sed -i 's/\r$//' "$GITHUB_WORKSPACE"/*.sh || true
          chmod +x \
            "$GITHUB_WORKSPACE/run17-orchestrate.sh" \
            "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh" \
            "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh" \
            "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh" \
            "$GITHUB_WORKSPACE/run25-susfs230-adapt.sh" \
            "$GITHUB_WORKSPACE/run26-disable-kpm.sh" \
            "$GITHUB_WORKSPACE/adapt-ksu-sucompat230.sh" \
            "$GITHUB_WORKSPACE/run28-extra-features.sh" \
            "$GITHUB_WORKSPACE/run29-manager-handshake.sh" \
            "$GITHUB_WORKSPACE/apply-binder-419-stability.sh" \
            "$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh" \
            "$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh" \
            "$GITHUB_WORKSPACE/apply-kernel-414186.sh" \
            "$GITHUB_WORKSPACE/apply-kernel-414357.sh"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'run17-orchestrate.sh'
          s = p.read_text()
          old_hooks = "run_step 'Layer verified ReSukiSU SUSFS hooks'\n"
          new_hooks = (
              "run_step 'Layer verified ReSukiSU SUSFS hooks'\n"
              '"$GITHUB_WORKSPACE/run25-susfs230-adapt.sh"\n'
          )
          if old_hooks not in s:
              raise SystemExit('cannot locate ReSukiSU hook layer step')
          s = s.replace(old_hooks, new_hooks, 1)
          old_cfg = "run_step 'Prepare proven A16 root config'\n"
          new_cfg = (
              "run_step 'Prepare proven A16 root config'\n"
              '"$GITHUB_WORKSPACE/run26-disable-kpm.sh"\n'
              '"$GITHUB_WORKSPACE/run29-manager-handshake.sh"\n'
          )
          if old_cfg not in s:
              raise SystemExit('cannot locate root-config step')
          s = s.replace(old_cfg, new_cfg, 1)
          old = '"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n\nrun_step \'Instrument exact BTF rejection path\''
          new = ('"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-kernel-414186.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-kernel-414357.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-binder-419-stability.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh"\n'
                 '"$GITHUB_WORKSPACE/run28-extra-features.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"\n\n'
                 'run_step \'Instrument exact BTF rejection path\'')
          if old not in s:
              raise SystemExit('cannot locate Run16 staging call in orchestrator')
          s = s.replace(old, new, 1)

          old_smoke = "echo '===== SMOKE-COMPILE REPAIRED BPF CLOSURE BEFORE LONG BUILD ====='\n"
          new_smoke = (
              "if [ \"$OPENELA_SCOPE\" = full ]; then\n"
              "  sed -i '/CONFIG_DEBUG_SECTION_MISMATCH),,-S/d' \"$KERNEL_DIR/scripts/Makefile.modpost\"\n"
              "fi\n\n"
              "if command -v ccache >/dev/null 2>&1; then\n"
              "  echo '===== INITIALIZING CCACHE WRAPPER ====='\n"
              "  export CCACHE_DIR=\"$HOME/.ccache\"\n"
              "  export CCACHE_MAXSIZE=\"5G\"\n"
              "  export CCACHE_COMPILERCHECK=\"content\"\n"
              "  ccache -s || true\n"
              "  if [ -n \"${CC:-}\" ] && [ -f \"$CC\" ] && [ ! -f \"${CC}.real\" ]; then\n"
              "    mv \"$CC\" \"${CC}.real\"\n"
              "    cat > \"$CC\" << 'EOF_CCACHE'\n"
              "#!/usr/bin/env bash\n"
              "exec ccache \"${0}.real\" \"$@\"\n"
              "EOF_CCACHE\n"
              "    chmod +x \"$CC\"\n"
              "    echo \"[PASS] Successfully wrapped $CC with ccache\"\n"
              "  fi\n"
              "  if [ -n \"${CC:-}\" ] && [ -f \"${CC}++\" ] && [ ! -f \"${CC}++.real\" ]; then\n"
              "    mv \"${CC}++\" \"${CC}++.real\"\n"
              "    cat > \"${CC}++\" << 'EOF_CCACHE'\n"
              "#!/usr/bin/env bash\n"
              "exec ccache \"${0}.real\" \"$@\"\n"
              "EOF_CCACHE\n"
              "    chmod +x \"${CC}++\"\n"
              "    echo \"[PASS] Successfully wrapped ${CC}++ with ccache\"\n"
              "  fi\n"
              "fi\n\n"
              + old_smoke
          )
          if old_smoke not in s:
              raise SystemExit('cannot locate smoke compile in orchestrator')
          s = s.replace(old_smoke, new_smoke, 1)
          stable_scripts = {
              "stable190": "apply-kernel-414190.sh",
              "stable200": "apply-kernel-414200.sh",
              "direct357": "apply-kernel-direct357.sh",
          }
          stable_script = stable_scripts.get(os.environ["OPENELA_SCOPE"])
          if stable_script:
              build = "run_step 'Build BTF EXP2 kernel'\n"
              if s.count(build) != 1:
                  raise SystemExit("Cannot locate the final kernel build")
              prepare = f'bash "$GITHUB_WORKSPACE/{stable_script}"\n'
              if stable_script == "apply-kernel-direct357.sh":
                  prepare += (
                      'cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/openela-report/config-before-openela"\n'
                      'make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ CC="$CC" REAL_CC="$REAL_CC" '
                      'LD="$LD" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" '
                      'CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig\n'
                      'cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/openela-report/config-after-openela"\n'
                  )
              s = s.replace(build, prepare + build, 1)
          p.write_text(s)
          PY

          grep -n 'run25-susfs230-adapt' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run26-disable-kpm' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run29-manager-handshake' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run28-extra-features' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-kernel-414186' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-kernel-414357' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-cgroup-v2-freezer' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-binder-419-stability' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-binder-los24-freeze' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          ! grep -n 'run18-sukisu-swap' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          ! grep -n 'run19-kpm-enable' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="5G"
          export CCACHE_COMPILERCHECK="content"
          ccache -s || true
          GITHUB_SHA="$source_ref" "$GITHUB_WORKSPACE/run17-orchestrate.sh" 2>&1 | tee "$GITHUB_WORKSPACE/run26-build.log"
          ccache -s || true

      - name: Collect compiler and linker errors
        if: failure()
        shell: bash
        run: |
          test -f run26-build.log || exit 0
          mkdir -p openela-report
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("run26-build.log").read_text(errors="replace")
          errors = dict.fromkeys(
              line for line in log.splitlines()
              if re.search(r"^\S+:\d+(?::\d+)?: (?:fatal )?error:|undefined reference|No rule to make target|^FATAL: modpost:|^WARNING: .*Section mismatch", line)
          )
          Path("openela-report/compile-errors.txt").write_text("\n".join(errors) + "\n")
          print(f"Unique compiler and linker errors: {len(errors)}")
          for line in list(errors)[:120]:
              print(line)
          PY

      - name: Verify ReSukiSU SUSFS 2.3.0 and KPM off
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          CONFIG="$OUT_DIR/.config"
          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          test -s "$GITHUB_WORKSPACE/run26-disable-kpm-proof.txt"
          test -s "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fq 'droidspaces=off' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Eq 'rekernel=y-hooks|rekernel=y-source-hooks-partial' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fq 'tcp_brutal=y' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fq 'adios=mq-deadline-4.14-port' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fq 'network_enhance=y' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'susfs_to=v2.3.0' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'priority_uid_filter=enabled' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'is_statically=bool' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'bakasu_susfs_compat_unblocked=yes' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'flag_storage=inode_i_state' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'susfs_overlay=skipped' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fq 'CMD_SUSFS_SET_PRIORITY_UID_FILTER' include/linux/susfs_def.h
          grep -Fq 'susfs_set_priority_uid_filter' include/linux/susfs.h
          grep -Fq 'susfs_is_priority_uid_filtered' fs/susfs.c
          grep -Fq 'susfs_is_priority_uid_filtered' kernel/sys.c
          grep -Fq 'susfs_is_priority_uid_filtered' block/ioprio.c
          grep -E '[[:space:]]susfs_set_priority_uid_filter$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]susfs_set_priority_uid_filter$'
          grep -E '[[:space:]]susfs_is_priority_uid_filtered$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]susfs_is_priority_uid_filtered$'
          grep -Fxq 'kpm=disabled' "$GITHUB_WORKSPACE/run26-disable-kpm-proof.txt"
          grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -Fq 'user_path_at(dfd, filename, lookup_flags, &path)' fs/open.c
          ! grep -Fq 'filename_lookup(dfd, fname' fs/open.c
          ! grep -Fq 'filename_lookup(dfd, fname' fs/stat.c
          grep -Fq 'hooks=4.14_user_path_at+filename_user' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -q '^CONFIG_KSU=y$' "$CONFIG"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$CONFIG"
          test -s "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'hook_guard=CONFIG_KSU' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'custom_manager_size=0x039a' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'custom_manager_hash=366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          if [[ "$OPENELA_SCOPE" = stable190 || "$OPENELA_SCOPE" = stable200 ]]; then
            stable_report="$GITHUB_WORKSPACE/openela-report/$OPENELA_SCOPE"
            test -s "$stable_report/merge-summary.json"
            test -s "$stable_report/applied-stat.txt"
            grep -Fxq "SUBLEVEL = ${OPENELA_SCOPE#stable}" Makefile
          elif [ "$OPENELA_SCOPE" = point-release ]; then
            test -s "$GITHUB_WORKSPACE/openela-report/point-release.txt"
            test -s "$GITHUB_WORKSPACE/openela-report/fixes.tsv"
            test ! -e "$GITHUB_WORKSPACE/kernel-version-proof.txt"
            ! grep -Fxq 'SUBLEVEL = 357' Makefile
          else
            test -s "$GITHUB_WORKSPACE/openela-report/merge-summary.json"
            test -s "$GITHUB_WORKSPACE/openela-report/applied-stat.txt"
            if [ -s "$GITHUB_WORKSPACE/openela-report/conflicts.txt" ]; then
              test ! -e "$GITHUB_WORKSPACE/kernel-version-proof.txt"
              ! grep -Fxq 'SUBLEVEL = 357' Makefile
            else
              grep -Fxq 'conflicts=0' "$GITHUB_WORKSPACE/kernel-version-proof.txt"
              grep -Fxq 'SUBLEVEL = 357' Makefile
            fi
          fi
          test -s "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'wake_up_pollfree=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq '__wake_up_pollfree=exported' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'binder_thread_release=wake_up_pollfree' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'binder_max_threads=u32' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'mmput_async=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'async_pad_0size=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          test -s "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup_v2_freezer=applied' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup.freeze=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup.events=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'freezer_trap=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          test -s "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'binder_freeze=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'binder_freeze_race_fix=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'tf_update_txn=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fq 'BINDER_FREEZE' include/uapi/linux/android/binder.h
          grep -Fq 'BINDER_GET_FROZEN_INFO' include/uapi/linux/android/binder.h
          grep -Fq 'TF_UPDATE_TXN' include/uapi/linux/android/binder.h
          grep -Fq 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -E '[[:space:]]ksu_handle_sys_reboot$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]ksu_handle_sys_reboot$'
          ! grep -q '^CONFIG_KPM=y$' "$CONFIG"
          echo "resukisu_commit=${RESUKISU_COMMIT}" | tee -a "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          echo '[PASS] ReSukiSU image keeps 4.14 user_path_at hooks, KPM off, cgroup v2 freezer and binder freeze verified'

      - name: Package the verified kernel build
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$GITHUB_WORKSPACE/openela-report"
          cp "$OUT_DIR/.config" "$report/kernel.config"
          cp "$OUT_DIR/include/config/kernel.release" "$report/kernel.release"
          image="$OUT_DIR/arch/arm64/boot/Image"
          if [[ "$OPENELA_SCOPE" != full && "$OPENELA_SCOPE" != direct357 ]]; then
            case "$OPENELA_SCOPE" in
              stable200)
                reference_run=42963068114
                reference="$GITHUB_WORKSPACE/run194-reference/openela-report/Image"
                reference_sha=381f842a86faec1cbb7636242bb3f0e70a9f8fd7fc65feddc0ae4d5824251608
                package=PCHM30-Linux-4.14.200-boot-test-AK3.zip
                ;;
              stable190)
                reference_run=42959134812
                reference="$GITHUB_WORKSPACE/run191-reference/openela-report/Image"
                reference_sha=bc51b7c8115d5219c7b9c39aa82f46aab694fd71a9c711063a58155f7b76c69a
                package=PCHM30-Linux-4.14.190-boot-test-AK3.zip
                ;;
              *)
                reference_run=41267234453
                reference="$GITHUB_WORKSPACE/run152-reference/Image"
                reference_sha=a6d04d2520a3c9c282b35109fd5bf5b77a410a1c6d58d37b905cf5d78215c576
                package=PCHM30-Run152-OpenELA-boot-test-AK3.zip
                sha256sum -c "$report/run152-boot-sources.sha256"
                ;;
            esac
            if [[ "$OPENELA_SCOPE" = stable* ]]; then
              sublevel=${OPENELA_SCOPE#stable}
              grep -Eq "^4\.14\.$sublevel([+.-]|$)" "$report/kernel.release"
              readelf -SW "$OUT_DIR/vmlinux" > "$report/$OPENELA_SCOPE/elf-sections.txt"
              grep -Eq '\.altinstructions[[:space:]]' "$report/$OPENELA_SCOPE/elf-sections.txt"
              ! grep -Fq '.altinstr_replacement' "$report/$OPENELA_SCOPE/elf-sections.txt"
            fi
            python3 - "$reference" "$image" "$reference_sha" <<'PY'
          import hashlib
          import struct
          import sys
          from pathlib import Path

          baseline, candidate = (Path(path).read_bytes() for path in sys.argv[1:3])
          if hashlib.sha256(baseline).hexdigest() != sys.argv[3]:
              raise SystemExit("Reference Image does not match the phone-tested artifact")
          for image in (baseline, candidate):
              if image[56:60] != b"ARM\x64":
                  raise SystemExit("Invalid ARM64 Image header")
          for field, offset in (("text_offset", 8), ("flags", 24)):
              old, new = (struct.unpack_from("<Q", image, offset)[0] for image in (baseline, candidate))
              if old != new:
                  raise SystemExit(f"ARM64 {field} changed from the phone-tested image: {old:#x} -> {new:#x}")
              print(f"Phone-tested ARM64 {field} retained: {new:#x}")
          PY
            ! grep -Eq '^4\.14\.357([+.-]|$)' "$report/kernel.release"
            printf 'baseline_run=%s\nbaseline_image_sha256=%s\nkernel_release=%s\n' \
              "$reference_run" "$reference_sha" "$(cat "$report/kernel.release")" > "$report/boot-baseline.txt"
            cat "$report/fixes.tsv"
          elif [ "$OPENELA_SCOPE" = direct357 ]; then
            if [ -s "$report/conflicts.txt" ]; then
              echo "::warning::Direct OpenELA build has $(wc -l < "$report/conflicts.txt") unresolved paths."
              exit 0
            fi
            grep -Eq '^4\.14\.357([+.-]|$)' "$report/kernel.release"
            readelf -SW "$OUT_DIR/vmlinux" > "$report/elf-sections.txt"
            grep -Eq '\.altinstructions[[:space:]]' "$report/elf-sections.txt"
            ! grep -Fq '.altinstr_replacement' "$report/elf-sections.txt"
            python3 - "$GITHUB_WORKSPACE/run197-reference/openela-report/Image" "$image" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          baseline, candidate = (Path(path).read_bytes() for path in sys.argv[1:3])
          if hashlib.sha256(baseline).hexdigest() != "84ff35ab9d364dd95af812bd7961634d31218910182b247162d9e067ea6eba3b":
              raise SystemExit("Reference Image does not match the phone-tested Run 197 artifact")
          if candidate[56:60] != b"ARM\x64" or candidate[8:16] != baseline[8:16] or candidate[24:32] != baseline[24:32]:
              raise SystemExit("ARM64 image loading fields changed from Run 197")
          print("Run 197 ARM64 Image magic, text offset and flags verified")
          PY
            cp "$GITHUB_WORKSPACE/kernel-version-proof.txt" "$report/"
            package=PCHM30-OpenELA-4.14.357-boot-test-AK3.zip
          elif [ -s "$report/conflicts.txt" ]; then
            ! grep -Eq '^4\.14\.357([+.-]|$)' "$report/kernel.release"
            package=PCHM30-OpenELA-candidate-AK3.zip
            echo "::warning::Candidate compiled with $(wc -l < "$report/conflicts.txt") OpenELA source conflicts. Kernel release is $(cat "$report/kernel.release")."
          else
            grep -Eq '^4\.14\.357([+.-]|$)' "$report/kernel.release"
            cp "$GITHUB_WORKSPACE/kernel-version-proof.txt" "$report/"
            package=PCHM30-OpenELA-414357-AK3.zip
          fi
          cp "$image" "$report/Image"
          (cd "$report" && sha256sum Image > image.sha256)
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/package-pchm30-run17-ak3.sh" > "$RUNNER_TEMP/package-ak3.sh"
          bash "$RUNNER_TEMP/package-ak3.sh" "$image" "$report/$package"

      - name: Save completed compiler work after failed trial builds
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}

      - name: Upload OpenELA source and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-OpenELA-${{ matrix.scope }}-${{ github.run_number }}
          path: |
            openela-report/
            run26-build.log
            *proof.txt
          if-no-files-found: warn
