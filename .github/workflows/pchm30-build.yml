name: PCHM30 ReSukiSU SUSFS 2.2.0 Build

on:
  workflow_dispatch:
  push:
    branches: [pchm30-resukisu-susfs220-full]

permissions:
  contents: read

concurrency:
  group: pchm30-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30
  CONFIG_FILE: configs/PCHM30-resukisu-susfs220-full.config
  KSU_EXPECTED: beaaea0eb895dc41e7b9bf5e3f39e57aa9635bab
  KSU_HISTORY_EXPECTED: '4355'
  STOCK_X509_SHA256: 984030282928748f924a2ffd19b124e1885ef58529d878cacfc1b8c0043fdc33
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83

jobs:
  build:
    name: Build PCHM30 kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout PCHM30 kernel + ReSukiSU in official layout
        uses: actions/checkout@v4
        with:
          ref: pchm30-resukisu-susfs220-full
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: recursive

      - name: Restore full ReSukiSU history and verify source pins
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$(git -C KernelSU rev-parse --is-shallow-repository)" = true ]; then
            git -C KernelSU fetch --unshallow --tags origin
          else
            git -C KernelSU fetch --tags origin
          fi
          git -C KernelSU checkout --detach "$KSU_EXPECTED"

          KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          KSU_COUNT="$(git -C KernelSU rev-list --count HEAD)"
          echo "kernel=$(git rev-parse HEAD)"
          echo "KernelSU=$KSU_HEAD"
          echo "KernelSU history=$KSU_COUNT"

          test "$KSU_HEAD" = "$KSU_EXPECTED"
          test "$KSU_COUNT" = "$KSU_HISTORY_EXPECTED"
          grep -F '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          ! grep -q 'filter_count' include/linux/seccomp.h
          grep -F 'extern void put_seccomp_filter(struct task_struct *tsk);' include/linux/seccomp.h
          echo "$STOCK_X509_SHA256  certs/pchm30-stock-signing-key.x509" | sha256sum -c -

      - name: Reconstruct pinned OPPO vendor tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf oppo-vendor-source source/android/vendor
          git clone --filter=blob:none --no-checkout "$OPPO_VENDOR_REPO" oppo-vendor-source
          git -C oppo-vendor-source sparse-checkout init --cone
          git -C oppo-vendor-source sparse-checkout set source/android/vendor
          git -C oppo-vendor-source checkout --detach "$OPPO_VENDOR_COMMIT"
          test "$(git -C oppo-vendor-source rev-parse HEAD)" = "$OPPO_VENDOR_COMMIT"
          cp -a oppo-vendor-source/source/android/vendor source/android/vendor
          test -f source/android/vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt/Makefile
          echo "vendor=$(git -C oppo-vendor-source rev-parse HEAD)"

      - name: Audit OPPO external symlinks
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          ALL="$GITHUB_WORKSPACE/broken-symlinks-all.txt"
          BAD="$GITHUB_WORKSPACE/broken-symlinks-unexpected.txt"
          KNOWN="$KERNEL/drivers/soc/oplus/sensor"

          find "$KERNEL" -xtype l -print | sort > "$ALL" || true
          grep -Fvx "$KNOWN" "$ALL" > "$BAD" || true

          if [ -s "$BAD" ]; then
            echo 'Unexpected broken symlinks:'
            cat "$BAD"
            exit 1
          fi

          if grep -Fxq "$KNOWN" "$ALL"; then
            echo "[KNOWN UNUSED] $KNOWN -> $(readlink "$KNOWN")"
          fi

          test -f "$KERNEL/block/oppo_foreground_io_opt/Kconfig"
          echo '[PASS] all build-relevant external symlinks resolved'

      - name: Install host build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make git curl ca-certificates \
            python3 python3-jinja2 bc bison flex \
            libssl-dev libelf-dev libncurses-dev libtinfo5 libncurses5 \
            device-tree-compiler cpio gzip xz-utils zstd rsync unzip zip tar \
            openssl coreutils binutils file perl
          make --version | sed -n '1p'
          python3 --version
          echo "nproc=$(nproc)"

      - name: Download and verify archived toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p toolchain-assets "$TOOLCHAIN_ROOT"
          gh release download "$TOOLCHAIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir toolchain-assets \
            --pattern 'PCHM30-Snapdragon-LLVM-10.0.7.tar.zst' \
            --pattern 'PCHM30-GCC64-4.9-binutils2.27.tar.zst' \
            --pattern 'PCHM30-GCC32-4.9.tar.zst' \
            --pattern 'PCHM30-Qualcomm-MPGen-2.1.1-Python3-PATCHED.tar.zst' \
            --pattern 'SHA256SUMS.txt'

          pushd toolchain-assets >/dev/null
          grep -E 'PCHM30-(Snapdragon-LLVM-10\.0\.7|GCC64-4\.9-binutils2\.27|GCC32-4\.9|Qualcomm-MPGen-2\.1\.1-Python3-PATCHED)\.tar\.zst$' SHA256SUMS.txt > required.sums
          sha256sum -c required.sums
          popd >/dev/null

          for a in toolchain-assets/*.tar.zst; do
            sudo tar --zstd -xf "$a" -C "$TOOLCHAIN_ROOT"
          done
          sudo chown -R "$USER:$USER" "$TOOLCHAIN_ROOT"

      - name: Resolve and validate toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          SD="$TOOLCHAIN_ROOT/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK"
          G64="$TOOLCHAIN_ROOT/aarch64-linux-android-4.9"
          G32="$TOOLCHAIN_ROOT/arm-linux-androideabi-4.9"
          MP="$TOOLCHAIN_ROOT/mpgen-2.1.1-py3"

          test -x "$SD/bin/clang"
          test -x "$G64/bin/aarch64-linux-android-gcc"
          test -x "$G64/bin/aarch64-linux-android-ld"
          test -x "$G64/bin/aarch64-linux-android-elfedit"
          test -x "$G32/bin/arm-linux-androideabi-gcc"
          test -f "$MP/mpgen.py"

          # Kernel Makefile intentionally keeps CLANG_TRIPLE=aarch64-linux-gnu-.
          # The archived GCC is Android-prefixed, so provide the executable name
          # old Snapdragon Clang searches for when linking the arm64 vDSO.
          ln -sfn aarch64-linux-android-ld "$G64/bin/aarch64-linux-gnu-ld"

          "$SD/bin/clang" --version | head -n2
          "$G64/bin/aarch64-linux-android-gcc" --version | head -n1
          "$G64/bin/aarch64-linux-android-ld" --version | head -n1
          "$G64/bin/aarch64-linux-gnu-ld" --version | head -n1
          "$G32/bin/arm-linux-androideabi-gcc" --version | head -n1
          grep -F "binascii.hexlify(pyaload_bin).decode('ascii')" "$MP/mpgen.py"
          python3 -m compileall -q "$MP"

          echo "SDCLANG_DIR=$SD" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$G64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$G32" >> "$GITHUB_ENV"
          echo "MPGEN_DIR=$MP" >> "$GITHUB_ENV"

      - name: Export proven PCHM30 build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          {
            echo "KERNEL_DIR=$KERNEL"
            echo "ARCH=arm64"
            echo "TARGET_PRODUCT=trinket"
            echo "KCONFIG_NOTIMESTAMP=true"
            echo "KBUILD_BUILD_USER=root"
            echo "KBUILD_BUILD_HOST=ubuntu-8-196"
            echo "KBUILD_BUILD_VERSION=2"
            echo "KBUILD_BUILD_TIMESTAMP=Mon May 16 17:39:41 CST 2022"
            echo "SHIPPING_API_LEVEL=28"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "LOCALVERSION=+"
            echo "CC=$SDCLANG_DIR/bin/clang"
            echo "REAL_CC=$SDCLANG_DIR/bin/clang"
            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            echo "LD=$GCC64_DIR/bin/aarch64-linux-android-ld"
            echo "RTIC_MPGEN=python3 $MPGEN_DIR/mpgen.py"
            echo "OPPO_STOCK_SIGNING_X509=$KERNEL/certs/pchm30-stock-signing-key.x509"
            echo "PATH=$SDCLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            echo "PYTHONPATH=$MPGEN_DIR${PYTHONPATH:+:$PYTHONPATH}"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"

      - name: Prepare final verified config
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp "$CONFIG_FILE" "$OUT_DIR/.config"
          for opt in \
            KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -q "^CONFIG_${opt}=y$" "$OUT_DIR/.config"
          done

      - name: olddefconfig
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          unset LLVM LLVM_IAS KBUILD_COMPILER_STRING
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig

      - name: Build kernel
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          unset LLVM LLVM_IAS KBUILD_COMPILER_STRING
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" -j"$JOBS" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify linked kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/$KERNEL_REL/$OUT_DIR"
          test -s "$OUT/vmlinux"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/System.map"
          nm -n "$OUT/vmlinux" | grep -E '[[:space:]]susfs_init$'
          nm -n "$OUT/vmlinux" | grep -E '[[:space:]]rtic_mp$'
          strings "$OUT/vmlinux" | grep -F 'v2.2.0' | head -n1

          mkdir -p artifact
          cp "$OUT/arch/arm64/boot/Image" artifact/Image
          cp "$OUT/vmlinux" artifact/vmlinux
          cp "$OUT/System.map" artifact/System.map
          cp "$OUT/.config" artifact/PCHM30.config
          cp build.log artifact/build.log
          (cd artifact && sha256sum Image vmlinux System.map PCHM30.config > SHA256SUMS.txt)
          cat artifact/SHA256SUMS.txt

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-ReSukiSU-SUSFS220-FULL-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
