name: PCHM30 KSU Next olddefconfig debug2

on:
  workflow_dispatch:
  push:
    branches: [pchm30-ksunext-minhook-nosusfs]
    paths:
      - '.github/workflows/pchm30-ksunext-olddefconfig-debug2.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pchm30-ksunext-minhook-nosusfs
          path: source/android/kernel/msm-4.14
          fetch-depth: 1

      - name: Install KSU Next and manual hooks
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --filter=blob:none --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next fetch origin 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553 --tags
          git -C KernelSU-Next checkout --detach 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          python3 tools/pchm30/ksunext-minhook-integrate.py

      - name: Reconstruct OPPO vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf oppo-vendor-source source/android/vendor
          git clone --filter=blob:none --no-checkout https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git oppo-vendor-source
          git -C oppo-vendor-source sparse-checkout init --cone
          git -C oppo-vendor-source sparse-checkout set source/android/vendor
          git -C oppo-vendor-source checkout --detach 5e7bee452c72c948427b9131bec8cd5d92934f83
          cp -a oppo-vendor-source/source/android/vendor source/android/vendor
          test -f source/android/vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt/Makefile
          test -f source/android/kernel/msm-4.14/block/oppo_foreground_io_opt/Kconfig

      - name: Prepare config
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf out-pchm30-ksunext-debug
          mkdir -p out-pchm30-ksunext-debug
          cp configs/PCHM30-stock-running.config out-pchm30-ksunext-debug/.config
          scripts/config --file out-pchm30-ksunext-debug/.config -e OVERLAY_FS -e KSU -d KSU_KPROBES_HOOK -e KSU_LSM_SECURITY_HOOKS

      - name: Run olddefconfig and audit every assertion
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set +e
          make O=out-pchm30-ksunext-debug ARCH=arm64 olddefconfig V=1 2>&1 | tee "$GITHUB_WORKSPACE/olddefconfig2.log"
          rc=${PIPESTATUS[0]}
          echo "make_rc=$rc" | tee -a "$GITHUB_WORKSPACE/olddefconfig2.log"
          cfg=out-pchm30-ksunext-debug/.config
          for spec in \
            '^CONFIG_KSU=y$' \
            '^# CONFIG_KSU_KPROBES_HOOK is not set$' \
            '^CONFIG_KSU_LSM_SECURITY_HOOKS=y$' \
            '^CONFIG_OVERLAY_FS=y$'; do
            if grep -q "$spec" "$cfg"; then echo "PASS $spec"; else echo "FAIL $spec"; fi | tee -a "$GITHUB_WORKSPACE/olddefconfig2.log"
          done
          if grep -q '^CONFIG_.*SUSFS' "$cfg"; then echo 'FAIL SUSFS config present'; grep '^CONFIG_.*SUSFS' "$cfg"; else echo 'PASS no SUSFS config'; fi | tee -a "$GITHUB_WORKSPACE/olddefconfig2.log"
          if grep -q 'filter_count' include/linux/seccomp.h; then echo 'FAIL filter_count present'; else echo 'PASS stock seccomp ABI'; fi | tee -a "$GITHUB_WORKSPACE/olddefconfig2.log"
          exit "$rc"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-KSUNEXT-OLDDEFCONFIG-DEBUG2-${{ github.run_number }}
          path: |
            olddefconfig2.log
            source/android/kernel/msm-4.14/out-pchm30-ksunext-debug/.config
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
