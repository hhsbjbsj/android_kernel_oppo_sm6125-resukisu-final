name: PCHM30 OpenELA 4.14.357 integration audit

on:
  push:
    branches: [pchm30-openela-414357-integration]
    paths: [.github/workflows/pchm30-openela-414357-audit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact Run 152 kernel baseline
        uses: actions/checkout@v4
        with:
          ref: 0789fcca2cbcb74143492a70afc6c3b5a59251b7
          persist-credentials: false
      - name: Compare the OPPO tree against the stable and OpenELA trees
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/openela-audit"
          report="$RUNNER_TEMP/openela-audit"
          vendor=$(git rev-parse HEAD)
          git fetch --no-tags --depth=1 https://github.com/openela/kernel-lts.git refs/tags/v4.14.357-openela
          target=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$target" = 1e6347375d088ecc896aabb067131d0f9e3c0575
          timeout 300 git fetch --no-tags --depth=1 https://github.com/gregkh/linux.git refs/tags/v4.14.180
          base=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$base" = ab9dfda232481dcfaf549ce774004d116fc80c13
          git show "$base:Makefile" | sed -n '1,6p' > "$report/base-version.txt"
          grep -Fxq 'SUBLEVEL = 180' "$report/base-version.txt"
          git show "$target:Makefile" | sed -n '1,6p' > "$report/target-version.txt"
          git show "$target:.elts/config.yaml" > "$report/openela-config.yml"
          printf 'vendor=%s\nbase=%s\ntarget=%s\n' "$vendor" "$base" "$target" > "$report/revisions.txt"
          git diff --no-renames --name-status "$base" "$target" > "$report/upstream-paths.tsv"
          git -c user.name='PCHM30 integration audit' -c user.email='41898282+github-actions[bot]@users.noreply.github.com'             commit-tree "$vendor^{tree}" -p "$base" -m 'Audit OPPO snapshot' > "$report/vendor-audit-commit.txt"
          git -c user.name='PCHM30 integration audit' -c user.email='41898282+github-actions[bot]@users.noreply.github.com'             commit-tree "$target^{tree}" -p "$base" -m 'Audit OpenELA snapshot' > "$report/target-audit-commit.txt"
          status=0
          git -c merge.renames=false merge-tree --write-tree "$(cat "$report/vendor-audit-commit.txt")"             "$(cat "$report/target-audit-commit.txt")" > "$report/merge-tree.txt" || status=$?
          if (( status > 1 )); then exit "$status"; fi
          git diff --stat "$vendor" "$(head -n 1 "$report/merge-tree.txt")" > "$report/merge-stat.txt"
          python3 - "$report" <<'PY'
          import collections
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1])
          upstream = (report / "upstream-paths.tsv").read_text().splitlines()
          merge = (report / "merge-tree.txt").read_text().splitlines()
          conflicts = sorted({
              line.split("\t", 1)[1]
              for line in merge
              if re.match(r"^\d{6} [0-9a-f]{40} [123]\t", line)
          })
          (report / "conflicts.txt").write_text("\n".join(conflicts) + "\n")
          groups = collections.Counter(path.split("/", 1)[0] for path in conflicts)
          print(f"Upstream changed paths: {len(upstream)}")
          print(f"Three-way conflict paths: {len(conflicts)}")
          for area, count in groups.most_common():
              print(f"{area}: {count}")
          PY
      - name: Check Floppy's merge against the OPPO conflict list
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/openela-audit"
          floppy_merge=01cc026e04d65e323f74fdffbaf715dd777750e9
          floppy_before=a87f54d89e63df0929e47a3b2f7c0934c6060c15
          timeout 300 git fetch --no-tags --depth=1 --filter=blob:none https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git "$floppy_merge" "$floppy_before"
          python3 - "$report" "$floppy_before" "$floppy_merge" <<'PY'
          import pathlib
          import subprocess
          import sys

          def tree(ref):
              lines = subprocess.check_output(["git", "ls-tree", "-r", "-z", ref]).split(b"\0")
              return dict(line.split(b"\t", 1)[::-1] for line in lines if line)

          report = pathlib.Path(sys.argv[1])
          vendor = tree("HEAD")
          flop_before, flop_after = (tree(ref) for ref in sys.argv[2:])
          reusable = []
          for path in (report / "conflicts.txt").read_bytes().splitlines():
              if vendor.get(path) and vendor[path].split()[1:] == flop_before.get(path, b"").split()[1:]:
                  if flop_before[path] != flop_after.get(path):
                      reusable.append(path)
          (report / "same-input-floppy-resolutions.txt").write_bytes(b"".join(path + b"\n" for path in reusable))
          print(f"Conflicts with an identical input blob changed by Floppy's merge: {len(reusable)}")
          for path in reusable:
              print(path.decode())
          PY
          cat "$report/conflicts.txt"
      - name: Verify the OpenELA integration script on the pinned source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/apply-kernel-414357.sh" > "$RUNNER_TEMP/apply-openela.sh"
          bash -n "$RUNNER_TEMP/apply-openela.sh"
          export KERNEL_DIR="$PWD"
          before=$(git rev-parse HEAD)
          if bash "$RUNNER_TEMP/apply-openela.sh"; then
            echo 'Expected the current conflict set to block release mode' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$before"
          test -s "$GITHUB_WORKSPACE/openela-report/conflicts.txt"
          test ! -e "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          OPENELA_COMPILE_CANDIDATE=1 bash "$RUNNER_TEMP/apply-openela.sh"
          test "$(git rev-parse HEAD)" != "$before"
          test -s "$GITHUB_WORKSPACE/openela-report/applied-stat.txt"
          grep -Fxq 'SUBLEVEL = 180' Makefile
          test ! -e "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          git diff --numstat "$before" HEAD | awk 'END { print "Actually changed source paths:", NR }'
          cp -a "$GITHUB_WORKSPACE/openela-report" "$RUNNER_TEMP/openela-audit/applied"
      - name: Upload source integration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pchm30-openela-audit
          path: ${{ runner.temp }}/openela-audit

  donor-census:
    name: Find comparable Floppy inputs for remaining OPPO conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pinned OPPO baseline
        uses: actions/checkout@v4
        with:
          ref: 0789fcca2cbcb74143492a70afc6c3b5a59251b7
          persist-credentials: false
      - name: Download the prepared-tree conflict evidence from Run 180
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42917435426
          name: PCHM30-OpenELA-full-180
          path: ${{ runner.temp }}/prepared-openela
      - name: Inspect the source around the remaining compile errors
        shell: bash
        run: |
          set -Eeuo pipefail
          patch=$(find "$RUNNER_TEMP/prepared-openela" -name candidate.patch -print -quit)
          test -n "$patch"
          for path in net/ipv4/inet_connection_sock.c include/linux/signal.h include/linux/mod_devicetable.h; do
            echo "Patch for $path"
            awk -v needle="diff --git a/$path b/$path" '
              /^diff --git / { show = ($0 == needle) }
              show { print }
            ' "$patch"
          done
          path=net/ipv4/inet_connection_sock.c
          if git apply --check --include="$path" "$patch"; then
            git apply --include="$path" "$patch"
            nl -ba "$path" | sed -n '230,390p'
            git restore -- "$path"
          fi
      - name: Check remaining OPPO conflicts against pinned Note 8 revisions
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 300 git fetch --no-tags --depth=1 --filter=blob:none https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git \
            1a096135285e10af5823e83460c6755af3ad37b5 \
            8ecbdeb1f0edcf6182139cc57b3df7fa01eb8cae \
            5222c7470371a3a24cde371d8981750a2643dafc \
            0cb4cc5d83b2c1a76a08bac48ee33d88535898bc \
            3d5eaa770b520bd55bb2151197c6c36f7bfc9493 \
            86c833a1bbf4e8676cbed693326c01c6a707eb84
          timeout 300 git fetch --no-tags --depth=1 --filter=blob:none https://github.com/LineageOS/android_kernel_xiaomi_sm6125.git \
            8aaa002bfb7ba1cac2c02dbb42ae0259ef2e47ba
          python3 - "$RUNNER_TEMP" <<'PY'
          import collections
          import pathlib
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          root = pathlib.Path(sys.argv[1])
          prepared = root / "prepared-openela"
          report, = prepared.rglob("merge-tree.bin")
          conflicts = set((report.parent / "conflicts.txt").read_text().splitlines())
          refs = {
              "nicobar-190": "1a096135285e10af5823e83460c6755af3ad37b5",
              "nicobar-290": "8ecbdeb1f0edcf6182139cc57b3df7fa01eb8cae",
              "laum-190": "5222c7470371a3a24cde371d8981750a2643dafc",
              "trinket-214": "0cb4cc5d83b2c1a76a08bac48ee33d88535898bc",
              "laum-336": "3d5eaa770b520bd55bb2151197c6c36f7bfc9493",
              "floppy-357": "86c833a1bbf4e8676cbed693326c01c6a707eb84",
          }

          def tree(commit):
              entries = subprocess.check_output(["git", "ls-tree", "-rz", commit]).split(b"\0")
              return {
                  path.decode(): metadata.split()[-1]
                  for metadata, path in (entry.split(b"\t", 1) for entry in entries if entry)
              }

          stages = collections.defaultdict(dict)
          for entry in report.read_bytes().split(b"\0")[1:]:
              if not entry:
                  break
              metadata, path = entry.split(b"\t", 1)
              _, oid, stage = metadata.split()
              stages[path.decode()][stage] = oid

          trees = {name: tree(commit) for name, commit in refs.items()}
          latest = trees.pop("floppy-357")
          lineage = tree("8aaa002bfb7ba1cac2c02dbb42ae0259ef2e47ba")
          baseline = tree("HEAD")
          counts = collections.Counter()
          rows = []
          for path in sorted(conflicts):
              vendor = stages[path].get(b"2")
              target = stages[path].get(b"3")
              donor = latest.get(path)
              matches = [name for name, blobs in trees.items() if vendor and blobs.get(path) == vendor]
              if not vendor or not donor:
                  category = "missing-side"
              elif donor == vendor:
                  category = "donor-retains-input"
              elif matches:
                  category = "same-input-review"
              else:
                  category = "different-input"
              counts[category] += 1
              rows.append((path, category, ",".join(matches), (vendor or b"").decode(),
                           (target or b"").decode(), (donor or b"").decode()))
          out = root / "openela-donor-census.tsv"
          out.write_text("path\tcategory\tmatching_refs\tprepared_oppo\topenela\tfloppy\n"
                         + "".join("\t".join(row) + "\n" for row in rows))
          print(f"Prepared source conflict paths: {len(conflicts)}")
          for key, count in counts.most_common():
              print(f"{key}: {count}")
          for path, category, matches, *_ in rows:
              print(f"{path}: {category} {matches}".rstrip())

          def blob(oid):
              return subprocess.check_output(["git", "cat-file", "blob", oid.decode()])

          def merge(*contents):
              with TemporaryDirectory() as tmp:
                  files = [pathlib.Path(tmp) / name for name in ("local", "base", "remote")]
                  for file, content in zip(files, contents):
                      file.write_bytes(content)
                  result = subprocess.run(["git", "merge-file", "-p", *files], capture_output=True)
                  return result.stdout if result.returncode == 0 else None

          rebased = []
          for path in sorted(conflicts):
              original = stages[path].get(b"2")
              output = latest.get(path)
              previous = trees["nicobar-190"].get(path)
              if (not original or not output or not previous or previous == output
                      or original != baseline.get(path) or original == previous
                      or previous != trees["trinket-214"].get(path)
                      or output != lineage.get(path)
                      or "/boot/dts/" in path or "/configs/" in path
                      or not path.endswith((".c", ".h", ".S", ".rst", ".txt"))):
                  continue
              local, base, donor = (blob(oid) for oid in (original, previous, output))
              if any(b"\0" in data for data in (local, base, donor)):
                  continue
              port = merge(local, base, donor)
              if port is None or port == local or port == donor or merge(port, donor, base) != local:
                  continue
              result = subprocess.check_output(["git", "hash-object", "--stdin"], input=port).decode().strip()
              rebased.append((path, original.decode(), previous.decode(), output.decode(), result))
          (root / "openela-donor-rebases.tsv").write_text(
              "path\tprepared_oppo\tshared_CAF_input\tmatching_donor_output\trebased_output\n"
              + "".join("\t".join(row) + "\n" for row in rebased)
          )
          print(f"Clean reversible Note 8 rebases to review: {len(rebased)}")
          for path, *_ in rebased:
              print(path)
          PY
      - name: Verify complete OpenELA patches in the compiled source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          base=ab9dfda232481dcfaf549ce774004d116fc80c13
          target=1e6347375d088ecc896aabb067131d0f9e3c0575
          timeout 300 git fetch --no-tags --depth=1 https://github.com/gregkh/linux.git refs/tags/v4.14.180
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$base"
          timeout 300 git fetch --no-tags --depth=1 https://github.com/openela/kernel-lts.git refs/tags/v4.14.357-openela
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$target"
          python3 - "$RUNNER_TEMP" "$base" "$target" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          root = pathlib.Path(sys.argv[1])
          base, target = sys.argv[2:]
          evidence, = (root / "prepared-openela").rglob("candidate.patch")
          conflicts = set((evidence.parent / "conflicts.txt").read_bytes().splitlines())
          chunks = {}
          for chunk in re.split(rb"(?m)(?=^diff --git )", evidence.read_bytes()):
              match = re.match(rb"diff --git a/([^\n]+) b/\1\nindex ([0-9a-f]+)\.\.([0-9a-f]+) (100644|100755)\n", chunk)
              if match and match[1] in conflicts:
                  chunks[match[1]] = (chunk, match[2], match[3], match[4])
          verified = []
          with TemporaryDirectory() as temporary:
              for path, (candidate_patch, before, after, mode) in sorted(chunks.items()):
                  if b"GIT binary patch" in candidate_patch:
                      continue
                  path_text = path.decode()
                  staged = subprocess.run(["git", "rev-parse", "--verify", f"HEAD:{path_text}"], capture_output=True)
                  if staged.returncode or not staged.stdout.startswith(before):
                      continue
                  original = subprocess.check_output(["git", "show", f"HEAD:{path_text}"])
                  if b"\0" in original:
                      continue
                  upstream_patch = subprocess.check_output([
                      "git", "--literal-pathspecs", "diff", "--no-renames", "--no-ext-diff",
                      "--no-textconv", base, target, "--", path_text,
                  ])
                  if not upstream_patch or b"\nBinary files " in upstream_patch:
                      continue
                  file = pathlib.Path(temporary) / path_text
                  file.parent.mkdir(parents=True, exist_ok=True)
                  file.write_bytes(original)
                  file.chmod(0o755 if mode == b"100755" else 0o644)

                  def apply(patch, *options):
                      return subprocess.run(
                          ["git", "apply", "--whitespace=nowarn", *options],
                          input=patch, cwd=temporary, capture_output=True,
                      ).returncode == 0

                  if not apply(candidate_patch):
                      continue
                  content = file.read_bytes()
                  oid = subprocess.check_output(["git", "hash-object", "--stdin"], input=content).strip()
                  if not oid.startswith(after):
                      raise SystemExit(f"Candidate patch did not reproduce the recorded output for {path_text}")
                  if not apply(upstream_patch, "--reverse") or not apply(upstream_patch):
                      continue
                  if file.read_bytes() != content:
                      continue
                  verified.append((path_text, staged.stdout.decode().strip(), oid.decode()))

          (root / "openela-verified-candidate-hunks.tsv").write_text(
              "path\tprepared_oppo\tcandidate\n" + "".join("\t".join(row) + "\n" for row in verified)
          )
          print(f"Paths with the full OpenELA patch present in the build candidate: {len(verified)}")
          for path, *_ in verified:
              print(path)
          PY
      - name: Upload exact donor input comparison
        uses: actions/upload-artifact@v4
        with:
          name: pchm30-openela-donor-census
          path: |
            ${{ runner.temp }}/openela-donor-census.tsv
            ${{ runner.temp }}/openela-donor-rebases.tsv
            ${{ runner.temp }}/openela-verified-candidate-hunks.tsv
