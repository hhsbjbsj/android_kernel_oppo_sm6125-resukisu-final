name: PCHM30 RapliVx KernelSU Build

on:
  workflow_dispatch:
  push:
    branches: [pchm30-raplivx-kernelsu]
    paths:
      - '.github/workflows/pchm30-raplivx-kernelsu-build.yml'
      - 'configs/**'
      - 'fs/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'include/**'
      - 'security/**'
      - 'certs/**'

permissions:
  contents: read

concurrency:
  group: pchm30-raplivx-kernelsu-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-raplivx-ksu
  CONFIG_FILE: configs/PCHM30-stock-running.config

  RAPLIVX_REPO: https://github.com/RapliVx/KernelSU.git
  # Last RapliVx revision before the July syscall-wrapper ABI upstream.
  # This revision uses sys_enter tracepoints + kretprobes and matches old ARM64 4.14.
  RAPLIVX_COMMIT: 4f96f85147799a91c14accb7fd13bd25eed5998e

  STOCK_X509_SHA256: 984030282928748f924a2ffd19b124e1885ef58529d878cacfc1b8c0043fdc33
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83

  BOOT_TEMPLATE_RELEASE_TAG: pchm30-verified-kernels-20260809
  BOOT_TEMPLATE_ASSET: PCHM30-ReSukiSU-ONLY.img
  BOOT_TEMPLATE_SHA256: f426a976b2c4ee6da5df0c1f6a23df09aaa8c5357dd4bac00065641cd804e6e5
  MAGISK_VERSION: v30.7
  MAGISK_APK_SHA256: e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5

jobs:
  build:
    name: Build PCHM30 RapliVx KernelSU + boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout clean PCHM30 experimental branch
        uses: actions/checkout@v4
        with:
          ref: pchm30-raplivx-kernelsu
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Install pinned RapliVx KernelSU 4.14 tracepoint source
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf RapliVx-KernelSU drivers/kernelsu
          git clone --filter=blob:none --no-checkout "$RAPLIVX_REPO" RapliVx-KernelSU
          git -C RapliVx-KernelSU fetch origin "$RAPLIVX_COMMIT"
          git -C RapliVx-KernelSU checkout --detach "$RAPLIVX_COMMIT"
          test "$(git -C RapliVx-KernelSU rev-parse HEAD)" = "$RAPLIVX_COMMIT"

          test -f RapliVx-KernelSU/kernel/Kconfig
          test -f RapliVx-KernelSU/kernel/Kbuild
          test -f RapliVx-KernelSU/kernel/syscall_hook_manager.c
          grep -q '^config KSU$' RapliVx-KernelSU/kernel/Kconfig
          grep -q 'depends on KPROBES' RapliVx-KernelSU/kernel/Kconfig
          grep -Fq 'kernelsu-objs += syscall_hook_manager.o' RapliVx-KernelSU/kernel/Kbuild
          grep -Fq 'register_trace_sys_enter' RapliVx-KernelSU/kernel/syscall_hook_manager.c
          grep -Fq 'CONFIG_HAVE_SYSCALL_TRACEPOINTS' RapliVx-KernelSU/kernel/syscall_hook_manager.c
          grep -Fq 'CONFIG_KRETPROBES' RapliVx-KernelSU/kernel/syscall_hook_manager.c

          # Linux 4.14 compatibility for this pinned RapliVx revision:
          # 1) module namespace import metadata does not exist yet;
          # 2) struct seccomp.filter_count was introduced after old 4.x kernels;
          # 3) syscall_hook_manager.c needs the backported nofault uaccess API
          #    explicitly because this pinned revision does not include uaccess.h.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('RapliVx-KernelSU/kernel')

          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in {'.c', '.h'}:
                  continue
              text = p.read_text(errors='surrogateescape')
              lines = text.splitlines(True)
              new = [line for line in lines if 'MODULE_IMPORT_NS(' not in line]
              if new != lines:
                  p.write_text(''.join(new), errors='surrogateescape')
                  changed.append(str(p))

          app = root / 'app_profile.c'
          text = app.read_text()
          needle = '    atomic_set(&current->seccomp.filter_count, 0);\n'
          replacement = (
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'
              + needle
              + '#endif\n'
          )
          if needle not in text:
              raise SystemExit('RapliVx app_profile filter_count call not found')
          if 'KERNEL_VERSION(5, 9, 0)' not in text:
              text = text.replace(needle, replacement, 1)
              app.write_text(text)
              changed.append(str(app))

          hook = root / 'syscall_hook_manager.c'
          text = hook.read_text()
          include_anchor = '#include <linux/slab.h>\n'
          uaccess_include = '#include <linux/uaccess.h>\n'
          if uaccess_include not in text:
              if include_anchor not in text:
                  raise SystemExit('RapliVx syscall_hook_manager include anchor not found')
              text = text.replace(include_anchor, include_anchor + uaccess_include, 1)
              hook.write_text(text)
              changed.append(str(hook))

          print('4.14-compat:', *changed, sep='\n  ')
          PY

          ! grep -R -n 'MODULE_IMPORT_NS' RapliVx-KernelSU/kernel
          grep -Fq '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)' RapliVx-KernelSU/kernel/app_profile.c
          grep -Fq 'atomic_set(&current->seccomp.filter_count, 0);' RapliVx-KernelSU/kernel/app_profile.c
          grep -Fq '#include <linux/uaccess.h>' RapliVx-KernelSU/kernel/syscall_hook_manager.c

          ln -sfn ../RapliVx-KernelSU/kernel drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          ! grep -Rqi 'CONFIG_KSU_SUSFS\|susfs' RapliVx-KernelSU/kernel
          ! grep -Fq 'ksu_handle_input_handle_event' drivers/input/input.c
          ! grep -q 'filter_count' include/linux/seccomp.h

          git diff --check
          echo "kernel=$(git rev-parse HEAD)"
          echo "RapliVx-KernelSU=$(git -C RapliVx-KernelSU rev-parse HEAD)"
          echo '[PASS] RapliVx pre-wrapper tracepoint source installed for ARM64 4.14'
          echo '[PASS] no manual-hook graft, SUSFS absent, stock seccomp/input untouched'

      - name: Reconstruct pinned OPPO vendor tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf oppo-vendor-source source/android/vendor
          git clone --filter=blob:none --no-checkout "$OPPO_VENDOR_REPO" oppo-vendor-source
          git -C oppo-vendor-source sparse-checkout init --cone
          git -C oppo-vendor-source sparse-checkout set source/android/vendor
          git -C oppo-vendor-source checkout --detach "$OPPO_VENDOR_COMMIT"
          test "$(git -C oppo-vendor-source rev-parse HEAD)" = "$OPPO_VENDOR_COMMIT"
          cp -a oppo-vendor-source/source/android/vendor source/android/vendor
          test -f source/android/vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt/Makefile

      - name: Audit OPPO external symlinks
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          ALL="$GITHUB_WORKSPACE/broken-symlinks-all.txt"
          BAD="$GITHUB_WORKSPACE/broken-symlinks-unexpected.txt"
          KNOWN="$KERNEL/drivers/soc/oplus/sensor"
          find "$KERNEL" -xtype l -print | sort > "$ALL" || true
          grep -Fvx "$KNOWN" "$ALL" > "$BAD" || true
          if [ -s "$BAD" ]; then
            echo 'Unexpected broken symlinks:'
            cat "$BAD"
            exit 1
          fi
          if grep -Fxq "$KNOWN" "$ALL"; then
            echo "[KNOWN UNUSED] $KNOWN -> $(readlink "$KNOWN")"
          fi
          test -f "$KERNEL/block/oppo_foreground_io_opt/Kconfig"
          echo '[PASS] all build-relevant external symlinks resolved'

      - name: Install host build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make git curl ca-certificates \
            python3 python3-jinja2 bc bison flex \
            libssl-dev libelf-dev libncurses-dev libtinfo5 libncurses5 \
            device-tree-compiler cpio gzip xz-utils zstd rsync unzip zip tar \
            openssl coreutils binutils file perl
          make --version | sed -n '1p'
          python3 --version
          echo "nproc=$(nproc)"

      - name: Download and verify archived PCHM30 toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p toolchain-assets "$TOOLCHAIN_ROOT"
          gh release download "$TOOLCHAIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir toolchain-assets \
            --pattern 'PCHM30-Snapdragon-LLVM-10.0.7.tar.zst' \
            --pattern 'PCHM30-GCC64-4.9-binutils2.27.tar.zst' \
            --pattern 'PCHM30-GCC32-4.9.tar.zst' \
            --pattern 'PCHM30-Qualcomm-MPGen-2.1.1-Python3-PATCHED.tar.zst' \
            --pattern 'SHA256SUMS.txt'
          pushd toolchain-assets >/dev/null
          grep -E 'PCHM30-(Snapdragon-LLVM-10\.0\.7|GCC64-4\.9-binutils2\.27|GCC32-4\.9|Qualcomm-MPGen-2\.1\.1-Python3-PATCHED)\.tar\.zst$' SHA256SUMS.txt > required.sums
          sha256sum -c required.sums
          popd >/dev/null
          for a in toolchain-assets/*.tar.zst; do
            sudo tar --zstd -xf "$a" -C "$TOOLCHAIN_ROOT"
          done
          sudo chown -R "$USER:$USER" "$TOOLCHAIN_ROOT"

      - name: Resolve and validate toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          SD="$TOOLCHAIN_ROOT/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK"
          G64="$TOOLCHAIN_ROOT/aarch64-linux-android-4.9"
          G32="$TOOLCHAIN_ROOT/arm-linux-androideabi-4.9"
          MP="$TOOLCHAIN_ROOT/mpgen-2.1.1-py3"
          test -x "$SD/bin/clang"
          test -x "$G64/bin/aarch64-linux-android-gcc"
          test -x "$G64/bin/aarch64-linux-android-ld"
          test -x "$G32/bin/arm-linux-androideabi-gcc"
          test -f "$MP/mpgen.py"
          test -f "$MP/mpgen_kernel.py"
          ln -sfn aarch64-linux-android-ld "$G64/bin/aarch64-linux-gnu-ld"

          python3 - "$MP/mpgen_kernel.py" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          fn = "def get_symbol_contents_as_str(self, symbol_name):"
          nxt = "def get_section_sha256(self, section_name):"
          fn_pos = text.find(fn)
          next_pos = text.find(nxt, fn_pos + len(fn))
          if fn_pos < 0 or next_pos < 0:
              raise SystemExit("MPGen function boundary not found")
          line_start = text.rfind("\n", 0, fn_pos) + 1
          next_line_start = text.rfind("\n", 0, next_pos) + 1
          indent = text[line_start:fn_pos]
          body = indent + ("\t" if "\t" in indent else "    ")
          body2 = body + ("\t" if "\t" in indent else "    ")
          replacement = (
              indent + fn + "\n"
              + body + "MODULE_DD_BIN = self.dd_symbol(symbol_name)\n"
              + body + "try:\n"
              + body2 + "with open(MODULE_DD_BIN, 'rb') as f:\n"
              + body2 + ("\t" if "\t" in indent else "    ") + "return f.read().decode('latin1')\n"
              + body + "finally:\n"
              + body2 + "mpgen_shell.rm(MODULE_DD_BIN)\n\n"
          )
          path.write_text(text[:line_start] + replacement + text[next_line_start:])
          PY
          python3 -m py_compile "$MP/mpgen_kernel.py"
          grep -Fq "return f.read().decode('latin1')" "$MP/mpgen_kernel.py"
          "$SD/bin/clang" --version | head -n2
          "$G64/bin/aarch64-linux-android-gcc" --version | head -n1
          "$G64/bin/aarch64-linux-android-ld" --version | head -n1
          "$G32/bin/arm-linux-androideabi-gcc" --version | head -n1
          python3 -m compileall -q "$MP"
          echo "SDCLANG_DIR=$SD" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$G64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$G32" >> "$GITHUB_ENV"
          echo "MPGEN_DIR=$MP" >> "$GITHUB_ENV"

      - name: Export proven PCHM30 build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          {
            echo "KERNEL_DIR=$KERNEL"
            echo "ARCH=arm64"
            echo "TARGET_PRODUCT=trinket"
            echo "KCONFIG_NOTIMESTAMP=true"
            echo "KBUILD_BUILD_USER=root"
            echo "KBUILD_BUILD_HOST=ubuntu-8-196"
            echo "KBUILD_BUILD_VERSION=2"
            echo "KBUILD_BUILD_TIMESTAMP=Mon May 16 17:39:41 CST 2022"
            echo "SHIPPING_API_LEVEL=28"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "LOCALVERSION=+"
            echo "CC=$SDCLANG_DIR/bin/clang"
            echo "REAL_CC=$SDCLANG_DIR/bin/clang"
            echo "CROSS_COMPILE=$GCC64_DIR/bin/aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=$GCC32_DIR/bin/arm-linux-androideabi-"
            echo "LD=$GCC64_DIR/bin/aarch64-linux-android-ld"
            echo "RTIC_MPGEN=python3 $MPGEN_DIR/mpgen.py"
            echo "OPPO_STOCK_SIGNING_X509=$KERNEL/certs/pchm30-stock-signing-key.x509"
            echo "PATH=$SDCLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
            echo "PYTHONPATH=$MPGEN_DIR${PYTHONPATH:+:$PYTHONPATH}"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"

      - name: Prepare RapliVx KernelSU config
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp "$CONFIG_FILE" "$OUT_DIR/.config"
          scripts/config --file "$OUT_DIR/.config" \
            -e KPROBES \
            -e KRETPROBES \
            -e KSU \
            -d KSU_DEBUG
          ! grep -q 'filter_count' include/linux/seccomp.h

      - name: olddefconfig and audit final RapliVx tracepoint mode
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          unset LLVM LLVM_IAS KBUILD_COMPILER_STRING
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig
          echo '===== RapliVx KSU final config ====='
          grep -E '^CONFIG_KSU|^# CONFIG_KSU|^CONFIG_KPROBES=|^CONFIG_KRETPROBES=|^CONFIG_HAVE_SYSCALL_TRACEPOINTS=' "$OUT_DIR/.config" || true
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KRETPROBES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y$' "$OUT_DIR/.config"
          ! grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          ! grep -q 'filter_count' include/linux/seccomp.h

      - name: Build RapliVx KernelSU kernel
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          unset LLVM LLVM_IAS KBUILD_COMPILER_STRING
          make O="$OUT_DIR" ARCH=arm64 LOCALVERSION=+ \
            CC="$CC" REAL_CC="$REAL_CC" LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" -j"$JOBS" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload RapliVx build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-RAPLIVX-KSU-DIAGNOSTIC-${{ github.run_number }}
          path: |
            build.log
            source/android/kernel/msm-4.14/out-pchm30-raplivx-ksu/.config
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Verify linked RapliVx KernelSU kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          KERNEL="$GITHUB_WORKSPACE/$KERNEL_REL"
          OUT="$KERNEL/$OUT_DIR"
          test -s "$OUT/vmlinux"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/System.map"
          test -s "$OUT/.config"
          test -s "$GITHUB_WORKSPACE/build.log"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^CONFIG_KPROBES=y$' "$OUT/.config"
          grep -q '^CONFIG_KRETPROBES=y$' "$OUT/.config"
          grep -q '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y$' "$OUT/.config"
          ! grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT/.config"
          ! grep -q 'filter_count' "$KERNEL/include/linux/seccomp.h"
          git -C "$KERNEL" diff --exit-code -- include/linux/seccomp.h
          git -C "$KERNEL" diff --exit-code -- drivers/input/input.c
          echo "$STOCK_X509_SHA256  $KERNEL/certs/pchm30-stock-signing-key.x509" | sha256sum -c -
          test "$(git -C "$KERNEL/RapliVx-KernelSU" rev-parse HEAD)" = "$RAPLIVX_COMMIT"

          test -s "$OUT/drivers/kernelsu/ksu.o"
          test -s "$OUT/drivers/kernelsu/syscall_hook_manager.o"
          test -s "$OUT/drivers/kernelsu/kernelsu.o"
          nm -n "$OUT/vmlinux" | grep -Eq '[[:space:]]kernelsu_init$'
          nm -n "$OUT/vmlinux" | grep -Eq '[[:space:]]ksu_syscall_hook_manager_init$'
          nm -n "$OUT/vmlinux" | grep -Eq '[[:space:]]ksu_sys_enter_handler$'

          echo '===== RapliVx KernelSU linked symbols ====='
          nm -n "$OUT/vmlinux" | grep -Ei 'kernelsu|ksu_' | sed -n '1,180p' || true
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$OUT/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/artifact/Image"
          cp "$OUT/vmlinux" "$GITHUB_WORKSPACE/artifact/vmlinux"
          cp "$OUT/System.map" "$GITHUB_WORKSPACE/artifact/System.map"
          cp "$OUT/.config" "$GITHUB_WORKSPACE/artifact/PCHM30-RAPLIVX-KSU.config"
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/artifact/build.log"
          git -C "$KERNEL/RapliVx-KernelSU" rev-parse HEAD > "$GITHUB_WORKSPACE/artifact/RAPLIVX_KSU_COMMIT.txt"

      - name: Prepare pinned x86_64 magiskboot and verified boot template
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TOOLS="$GITHUB_WORKSPACE/boot-tools"
          TEMPLATE_DIR="$GITHUB_WORKSPACE/boot-template"
          mkdir -p "$TOOLS" "$TEMPLATE_DIR"
          gh release download "$BOOT_TEMPLATE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BOOT_TEMPLATE_ASSET" \
            --dir "$TEMPLATE_DIR"
          TEMPLATE="$TEMPLATE_DIR/$BOOT_TEMPLATE_ASSET"
          echo "$BOOT_TEMPLATE_SHA256  $TEMPLATE" | sha256sum -c -
          test "$(stat -c '%s' "$TEMPLATE")" -eq 100663296
          APK="$TOOLS/Magisk-$MAGISK_VERSION.apk"
          curl --http1.1 -fL --retry 4 --retry-delay 2 --retry-all-errors \
            "https://github.com/topjohnwu/Magisk/releases/download/$MAGISK_VERSION/Magisk-$MAGISK_VERSION.apk" \
            -o "$APK"
          echo "$MAGISK_APK_SHA256  $APK" | sha256sum -c -
          unzip -j "$APK" 'lib/x86_64/libmagiskboot.so' -d "$TOOLS"
          mv "$TOOLS/libmagiskboot.so" "$TOOLS/magiskboot"
          chmod +x "$TOOLS/magiskboot"
          file "$TOOLS/magiskboot" | tee "$TOOLS/magiskboot.file.txt"
          grep -qiE 'x86-64|x86_64' "$TOOLS/magiskboot.file.txt"
          ! grep -qi 'ARM aarch64' "$TOOLS/magiskboot.file.txt"
          echo "MAGISKBOOT=$TOOLS/magiskboot" >> "$GITHUB_ENV"
          echo "BOOT_TEMPLATE=$TEMPLATE" >> "$GITHUB_ENV"

      - name: Package and verify RapliVx KernelSU boot image
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW="$GITHUB_WORKSPACE/artifact/Image"
          EXPECTED_IMAGE_SHA="$(sha256sum "$RAW" | awk '{print $1}')"
          PACK="$GITHUB_WORKSPACE/boot-pack"
          VERIFY="$GITHUB_WORKSPACE/boot-verify"
          FINAL="$GITHUB_WORKSPACE/artifact/PCHM30-RAPLIVX-KERNELSU-BOOT.img"
          RAMDISK_PROOF="$GITHUB_WORKSPACE/artifact/BOOT_TEMPLATE_RAMDISK_SHA256.txt"
          rm -rf "$PACK" "$VERIFY"
          mkdir -p "$PACK" "$VERIFY"
          cd "$PACK"
          cp "$BOOT_TEMPLATE" base.img
          "$MAGISKBOOT" cleanup >/dev/null 2>&1 || true
          "$MAGISKBOOT" unpack base.img
          test -s kernel
          test -s ramdisk.cpio
          RAMDISK_SHA="$(sha256sum ramdisk.cpio | awk '{print $1}')"
          printf '%s  ramdisk.cpio\n' "$RAMDISK_SHA" > "$RAMDISK_PROOF"
          cp "$RAW" kernel
          echo "$EXPECTED_IMAGE_SHA  kernel" | sha256sum -c -
          echo "$RAMDISK_SHA  ramdisk.cpio" | sha256sum -c -
          "$MAGISKBOOT" repack base.img "$FINAL"
          test -s "$FINAL"
          test "$(stat -c '%s' "$FINAL")" -eq 100663296
          cd "$VERIFY"
          "$MAGISKBOOT" cleanup >/dev/null 2>&1 || true
          "$MAGISKBOOT" unpack "$FINAL"
          test -s kernel
          test -s ramdisk.cpio
          echo "$EXPECTED_IMAGE_SHA  kernel" | sha256sum -c -
          echo "$RAMDISK_SHA  ramdisk.cpio" | sha256sum -c -
          echo '[PASS] final boot contains exact RapliVx KernelSU Actions Image'
          echo '[PASS] verified boot-template ramdisk preserved byte-for-byte'
          sha256sum "$FINAL"

      - name: Finalize artifact checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/artifact"
          sha256sum \
            Image \
            PCHM30-RAPLIVX-KERNELSU-BOOT.img \
            vmlinux System.map PCHM30-RAPLIVX-KSU.config build.log \
            RAPLIVX_KSU_COMMIT.txt BOOT_TEMPLATE_RAMDISK_SHA256.txt \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload RapliVx KernelSU kernel and flashable boot
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-RAPLIVX-KERNELSU-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
