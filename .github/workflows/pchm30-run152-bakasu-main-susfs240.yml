name: PCHM30 Run 152 BakaSU and SUSFS backport

on:
  workflow_dispatch:
  push:
    branches: [pchm30-run152-bakasu-main-susfs240]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_RELEASE_TAG: pchm30-build-environment-20260810
  TOOLCHAIN_ROOT: /opt/pchm30-toolchains
  KERNEL_REL: source/android/kernel/msm-4.14
  OUT_DIR: out-pchm30-a16-bpf
  CONFIG_FILE: configs/PCHM30-stock-running.config
  OPPO_VENDOR_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6125.git
  OPPO_VENDOR_COMMIT: 5e7bee452c72c948427b9131bec8cd5d92934f83
  ARESIN_REPO: https://github.com/jsdizkcksv/android_kernel_aresin.git
  ARESIN_PREREQ: 620d928acca50c8ba013554fc798dcf8b8910918
  A15_FIRST: a2b662dced04902eb8f1778ec8e30259dc680ff4
  A15_LAST: bd379f8140acc083fc386cc2600ee205b2a54e31
  A16_FIRST: c2c621b5448adc69e105b1519b93dd637a581da5
  A16_LAST: c74436291044381d4365d91afa0c8f4a574b22b4
  ROOT_SNAPSHOT: b667ba359bf7da11b43c5d6403788d21c19facd7
  RESUKISU_COMMIT: 548d1dda060ca198823d8808804d01f5209ef4a9
  RUN152_WORKFLOW_REF: f3b4ee6a48a03a67ece3b6699d3e07b4f278dca8
  SUSFS_240_UPSTREAM: 5436438b5cc77f146e04f71070da153dabe17a9d
  # Legacy variable names are retained by the nested step runners, but all
  # workflow inputs are immutable commit IDs rather than moving branches.
  ROOT_SUCCESS_BRANCH: 8c5504ca40cf4d2eea2ee03900afb59f3597a4c6
  ROOT_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-resukisu-susfs220-build.yml
  EXP1_BRANCH: 03d3358a4843cc2d9c6b66297be992038c862599
  EXP1_WORKFLOW: .github/workflows/pchm30-a16-btf-sockmap-exp1-v2.yml
  WIFI_SUCCESS_BRANCH: 8a34bec6dba9008efae807eea060ab34fcf288e1
  WIFI_SUCCESS_WORKFLOW: .github/workflows/pchm30-a16-wifi-abi-exp1-build.yml
  EXP2_BRANCH: 1bca57fe1a2afcf686083431b0cac29b32414201
  EXP2_WORKFLOW: .github/workflows/pchm30-a16-btf-exp2-diagnose.yml
  UPSTREAM_BTF_UAPI: f063c889c9458354a92b235a51cbb60d30321070
  UPSTREAM_BTF_KERNEL: 1dc92851849cc2235a1efef8f8d5a9255efc5f13
  RUN17_BTF_FIX_COMMIT: bc983ae72d5795d0ec2a5b5dd4292dfab1417e57
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Run 152 with BakaSU main and SUSFS 2.4 backports
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout exact successful A16 rootless baseline
        uses: actions/checkout@v4
        with:
          ref: 0789fcca2cbcb74143492a70afc6c3b5a59251b7
          path: source/android/kernel/msm-4.14
          fetch-depth: 1
          submodules: false

      - name: Install BTF host tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y dwarves binutils ccache
          pahole --version
          ccache --version

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref }}-
            kernel-ccache-${{ runner.os }}-${{ github.workflow }}-

      - name: Build the Run 152 kernel with the SUSFS backport
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$RUN17_BTF_FIX_COMMIT"
          git show "$GITHUB_SHA:.github/scripts/run16-orchestrate.sh" > "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-builtin-runtime-retry.sh" > "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"
          git show "$GITHUB_SHA:.github/scripts/run17-bbg-lz4kd.sh" > "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"
          git show "$GITHUB_SHA:.github/scripts/run25-susfs230-adapt.sh" > "$GITHUB_WORKSPACE/run25-susfs230-adapt.sh"
          git show "$GITHUB_SHA:.github/patches/run152-susfs240-backport.patch" > "$GITHUB_WORKSPACE/run152-susfs240-backport.patch"
          git show "$GITHUB_SHA:.github/patches/run152-susfs-runtime-fixes.patch" > "$GITHUB_WORKSPACE/run152-susfs-runtime-fixes.patch"
          git show "$GITHUB_SHA:.github/tests/test-run152-susfs.py" > "$GITHUB_WORKSPACE/test-run152-susfs.py"
          git show "$GITHUB_SHA:.github/tests/test-run152-bakasu.py" > "$GITHUB_WORKSPACE/test-run152-bakasu.py"
          git show "$GITHUB_SHA:.github/tests/test-run152-build-config.py" > "$GITHUB_WORKSPACE/test-run152-build-config.py"
          git show "$GITHUB_SHA:.github/scripts/run26-disable-kpm.sh" > "$GITHUB_WORKSPACE/run26-disable-kpm.sh"
          git show "$GITHUB_SHA:.github/scripts/rewrite-susfs230-hooks.py" > "$GITHUB_WORKSPACE/rewrite-susfs230-hooks.py"
          git show "$GITHUB_SHA:.github/scripts/adapt-ksu-sucompat230.sh" > "$GITHUB_WORKSPACE/adapt-ksu-sucompat230.sh"
          git show "$GITHUB_SHA:.github/scripts/run28-extra-features.sh" > "$GITHUB_WORKSPACE/run28-extra-features.sh"
          git show "$GITHUB_SHA:.github/scripts/run29-manager-handshake.sh" > "$GITHUB_WORKSPACE/run29-manager-handshake.sh"
          git show "$GITHUB_SHA:.github/scripts/apply-binder-419-stability.sh" > "$GITHUB_WORKSPACE/apply-binder-419-stability.sh"
          git show "$GITHUB_SHA:.github/scripts/apply-binder-los24-freeze.sh" > "$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh"
          git show "$GITHUB_SHA:.github/scripts/apply-cgroup-v2-freezer.sh" > "$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh"
          git show "$GITHUB_SHA:.github/scripts/apply-kernel-414186.sh" > "$GITHUB_WORKSPACE/apply-kernel-414186.sh"
          git show "$GITHUB_SHA:.github/scripts/apply-kernel-414357.sh" > "$GITHUB_WORKSPACE/apply-kernel-414357.sh"
          git show "$GITHUB_SHA:.github/scripts/package-pchm30-run17-ak3.sh" > "$GITHUB_WORKSPACE/package-pchm30-run17-ak3.sh"
          git show "$GITHUB_SHA:.github/patches/patch-4.14.180-to-186.patch" > "$GITHUB_WORKSPACE/patch-4.14.180-to-186.patch"
          git show "$RUN17_BTF_FIX_COMMIT:.github/scripts/run17-btf-kprobe-scene-fix.sh" > "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"
          sed -i 's/\r$//' "$GITHUB_WORKSPACE"/*.sh || true
          chmod +x \
            "$GITHUB_WORKSPACE/run17-orchestrate.sh" \
            "$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh" \
            "$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh" \
            "$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh" \
            "$GITHUB_WORKSPACE/run25-susfs230-adapt.sh" \
            "$GITHUB_WORKSPACE/run26-disable-kpm.sh" \
            "$GITHUB_WORKSPACE/adapt-ksu-sucompat230.sh" \
            "$GITHUB_WORKSPACE/run28-extra-features.sh" \
            "$GITHUB_WORKSPACE/run29-manager-handshake.sh" \
            "$GITHUB_WORKSPACE/apply-binder-419-stability.sh" \
            "$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh" \
            "$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh" \
            "$GITHUB_WORKSPACE/apply-kernel-414186.sh" \
            "$GITHUB_WORKSPACE/apply-kernel-414357.sh"

          python3 "$GITHUB_WORKSPACE/test-run152-build-config.py" \
            --kernel-dir "$PWD" --scripts-dir "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'run17-orchestrate.sh'
          s = p.read_text()
          old_hooks = "run_step 'Layer verified ReSukiSU SUSFS hooks'\n"
          new_hooks = (
              "run_step 'Layer verified ReSukiSU SUSFS hooks'\n"
              '"$GITHUB_WORKSPACE/run25-susfs230-adapt.sh"\n'
              'git apply "$GITHUB_WORKSPACE/run152-susfs240-backport.patch"\n'
              'git apply --check "$GITHUB_WORKSPACE/run152-susfs-runtime-fixes.patch"\n'
              'git apply "$GITHUB_WORKSPACE/run152-susfs-runtime-fixes.patch"\n'
              'python3 "$GITHUB_WORKSPACE/test-run152-susfs.py" --kernel-dir "$PWD"\n'
          )
          if old_hooks not in s:
              raise SystemExit('cannot locate ReSukiSU hook layer step')
          s = s.replace(old_hooks, new_hooks, 1)
          old_cfg = "run_step 'Prepare proven A16 root config'\n"
          new_cfg = (
              "run_step 'Prepare proven A16 root config'\n"
              '"$GITHUB_WORKSPACE/run26-disable-kpm.sh"\n'
              '"$GITHUB_WORKSPACE/run29-manager-handshake.sh"\n'
              'python3 "$GITHUB_WORKSPACE/test-run152-bakasu.py" --kernel-dir "$PWD"\n'
          )
          if old_cfg not in s:
              raise SystemExit('cannot locate root-config step')
          s = s.replace(old_cfg, new_cfg, 1)
          old = '"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n\nrun_step \'Instrument exact BTF rejection path\''
          new = ('"$GITHUB_WORKSPACE/run16-builtin-wifi-audio.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-builtin-runtime-retry.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-bbg-lz4kd.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-kernel-414186.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-kernel-414357.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-cgroup-v2-freezer.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-binder-419-stability.sh"\n'
                 '"$GITHUB_WORKSPACE/apply-binder-los24-freeze.sh"\n'
                 '"$GITHUB_WORKSPACE/run28-extra-features.sh"\n'
                 '"$GITHUB_WORKSPACE/run17-btf-kprobe-scene-fix.sh"\n\n'
                 'run_step \'Instrument exact BTF rejection path\'')
          if old not in s:
              raise SystemExit('cannot locate Run16 staging call in orchestrator')
          s = s.replace(old, new, 1)

          old_smoke = "echo '===== SMOKE-COMPILE REPAIRED BPF CLOSURE BEFORE LONG BUILD ====='\n"
          new_smoke = (
              "if command -v ccache >/dev/null 2>&1; then\n"
              "  echo '===== INITIALIZING CCACHE WRAPPER ====='\n"
              "  export CCACHE_DIR=\"$HOME/.ccache\"\n"
              "  export CCACHE_MAXSIZE=\"5G\"\n"
              "  export CCACHE_COMPILERCHECK=\"content\"\n"
              "  ccache -s || true\n"
              "  if [ -n \"${CC:-}\" ] && [ -f \"$CC\" ] && [ ! -f \"${CC}.real\" ]; then\n"
              "    mv \"$CC\" \"${CC}.real\"\n"
              "    cat > \"$CC\" << 'EOF_CCACHE'\n"
              "#!/usr/bin/env bash\n"
              "exec ccache \"${0}.real\" \"$@\"\n"
              "EOF_CCACHE\n"
              "    chmod +x \"$CC\"\n"
              "    echo \"[PASS] Successfully wrapped $CC with ccache\"\n"
              "  fi\n"
              "  if [ -n \"${CC:-}\" ] && [ -f \"${CC}++\" ] && [ ! -f \"${CC}++.real\" ]; then\n"
              "    mv \"${CC}++\" \"${CC}++.real\"\n"
              "    cat > \"${CC}++\" << 'EOF_CCACHE'\n"
              "#!/usr/bin/env bash\n"
              "exec ccache \"${0}.real\" \"$@\"\n"
              "EOF_CCACHE\n"
              "    chmod +x \"${CC}++\"\n"
              "    echo \"[PASS] Successfully wrapped ${CC}++ with ccache\"\n"
              "  fi\n"
              "fi\n\n"
              + old_smoke
          )
          if old_smoke not in s:
              raise SystemExit('cannot locate smoke compile in orchestrator')
          s = s.replace(old_smoke, new_smoke, 1)
          p.write_text(s)
          PY

          grep -n 'run25-susfs230-adapt' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run26-disable-kpm' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run29-manager-handshake' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'run28-extra-features' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-kernel-414186' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-kernel-414357' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-cgroup-v2-freezer' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-binder-419-stability' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          grep -n 'apply-binder-los24-freeze' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          ! grep -n 'run18-sukisu-swap' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          ! grep -n 'run19-kpm-enable' "$GITHUB_WORKSPACE/run17-orchestrate.sh"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="5G"
          export CCACHE_COMPILERCHECK="content"
          ccache -s || true
          "$GITHUB_WORKSPACE/run17-orchestrate.sh" 2>&1 | tee "$GITHUB_WORKSPACE/run26-build.log"
          ccache -s || true

      - name: Verify BakaSU and the SUSFS 2.4 backport
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          VMLINUX="$OUT_DIR/vmlinux"
          CONFIG="$OUT_DIR/.config"
          test -s "$IMAGE"
          test -s "$VMLINUX"
          test -s "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          test -s "$GITHUB_WORKSPACE/run26-disable-kpm-proof.txt"
          test -s "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fq 'droidspaces=off' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Eq 'rekernel=y-hooks|rekernel=y-source-hooks-partial' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'tcp_brutal=disabled' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'adios=not_integrated' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'network_enhance=configuration_only' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'io_scheduler=mq-deadline-built' "$GITHUB_WORKSPACE/run28-extra-features-proof.txt"
          grep -Fxq 'CONFIG_DEFAULT_BBR=y' "$CONFIG"
          grep -Fxq 'CONFIG_DEFAULT_TCP_CONG="bbr"' "$CONFIG"
          grep -Fxq 'CONFIG_MQ_IOSCHED_DEADLINE=y' "$CONFIG"
          ! grep -Eq '^CONFIG_TCP_CONG_BRUTAL=[ym]$' "$CONFIG"
          ! grep -Eq '^CONFIG_MQ_IOSCHED_ADIOS=[ym]$' "$CONFIG"
          # Repeat lifetime checks against the final staged sources after all
          # later compatibility layers have run, not only after patching.
          python3 "$GITHUB_WORKSPACE/test-run152-susfs.py" --kernel-dir "$PWD"
          python3 "$GITHUB_WORKSPACE/test-run152-bakasu.py" --kernel-dir "$PWD"
          grep -Fxq 'susfs_to=v2.3.0' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'priority_uid_filter=enabled' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'is_statically=bool' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'bakasu_susfs_compat_unblocked=yes' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'flag_storage=inode_i_state' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fxq 'susfs_overlay=skipped' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -Fq 'CMD_SUSFS_SET_PRIORITY_UID_FILTER' include/linux/susfs_def.h
          grep -Fq 'susfs_set_priority_uid_filter' include/linux/susfs.h
          grep -Fq 'susfs_is_priority_uid_filtered' fs/susfs.c
          grep -Fq 'susfs_is_priority_uid_filtered' kernel/sys.c
          grep -Fq 'susfs_is_priority_uid_filtered' block/ioprio.c
          grep -E '[[:space:]]susfs_set_priority_uid_filter$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]susfs_set_priority_uid_filter$'
          grep -E '[[:space:]]susfs_is_priority_uid_filtered$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]susfs_is_priority_uid_filtered$'
          grep -Fxq 'kpm=disabled' "$GITHUB_WORKSPACE/run26-disable-kpm-proof.txt"
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESUKISU_COMMIT"
          grep -Fq '#define SUSFS_VERSION "v2.4.0-pchm30"' include/linux/susfs.h
          grep -Fq 'v2.4.0-pchm30' "$GITHUB_WORKSPACE/run16-image-strings-all.txt"
          grep -Fq 'filp_open("/data/system/packages.list", O_RDONLY | O_NOATIME, 0)' fs/susfs.c
          grep -Fq 'nd->name = old_name;' fs/namei.c
          grep -Fq 'mnt->mnt_id < DEFAULT_KSU_MNT_ID' fs/namespace.c
          printf 'susfs_version=v2.4.0-pchm30\nsusfs_upstream=%s\nbakasu_commit=%s\nrun152_commit=%s\n' \
            "$SUSFS_240_UPSTREAM" "$RESUKISU_COMMIT" "$RUN152_WORKFLOW_REF" > "$GITHUB_WORKSPACE/run152-susfs240-proof.txt"
          grep -Fq 'user_path_at(dfd, filename, lookup_flags, &path)' fs/open.c
          ! grep -Fq 'filename_lookup(dfd, fname' fs/open.c
          ! grep -Fq 'filename_lookup(dfd, fname' fs/stat.c
          grep -Fq 'hooks=4.14_user_path_at+filename_user' "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          grep -q '^CONFIG_KSU=y$' "$CONFIG"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$CONFIG"
          test -s "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'hook_guard=CONFIG_KSU' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'custom_manager_size=0x039a' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fq 'custom_manager_hash=366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fxq 'cloexec_policy=upstream_preserved' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          grep -Fxq 'preinit=disabled_missing_legacy_exec_hooks' "$GITHUB_WORKSPACE/run29-manager-handshake-proof.txt"
          ! grep -Eq '[[:space:]]ksu_setup_preinit_file$|[[:space:]]ksu_preinit_handle_post_execveat$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt"
          test -s "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          grep -Fxq 'kernel_release_label=4.14.357-perf+' "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          grep -Fxq 'release_label_only=yes' "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          grep -Fxq 'full_4.14.357_backport=no' "$GITHUB_WORKSPACE/kernel-version-proof.txt"
          grep -q '^SUBLEVEL = 357$' Makefile
          test -s "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'wake_up_pollfree=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq '__wake_up_pollfree=exported' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'binder_thread_release=wake_up_pollfree' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'binder_max_threads=u32' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'mmput_async=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          grep -Fq 'async_pad_0size=applied' "$GITHUB_WORKSPACE/binder-419-proof.txt"
          test -s "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup_v2_freezer=applied' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup.freeze=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'cgroup.events=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'freezer_trap=supported' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          grep -Fxq 'freezer_inherit_flags=freeze+frozen' "$GITHUB_WORKSPACE/cgroup-v2-freezer-proof.txt"
          python3 - <<'PY_FREEZER'
          from pathlib import Path
          source = Path('kernel/cgroup/cgroup.c').read_text()
          start = source.index('cgrp->freezer.e_freeze = parent->freezer.e_freeze;')
          inherited = source[start:source.index('spin_lock_irq(&css_set_lock);', start)]
          assert 'set_bit(CGRP_FREEZE, &cgrp->flags);' in inherited
          assert 'set_bit(CGRP_FROZEN, &cgrp->flags);' in inherited
          PY_FREEZER
          test -s "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'binder_freeze=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'binder_freeze_race_fix=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fxq 'tf_update_txn=applied' "$GITHUB_WORKSPACE/binder-freeze-proof.txt"
          grep -Fq 'BINDER_FREEZE' include/uapi/linux/android/binder.h
          grep -Fq 'BINDER_GET_FROZEN_INFO' include/uapi/linux/android/binder.h
          grep -Fq 'TF_UPDATE_TXN' include/uapi/linux/android/binder.h
          grep -Fq 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -E '[[:space:]]ksu_handle_sys_reboot$' "$GITHUB_WORKSPACE/run16-vmlinux-nm-all.txt" || nm "$VMLINUX" | grep -E '[[:space:]]ksu_handle_sys_reboot$'
          ! grep -q '^CONFIG_KPM=y$' "$CONFIG"
          echo "resukisu_commit=${RESUKISU_COMMIT}" | tee -a "$GITHUB_WORKSPACE/run25-susfs230-proof.txt"
          echo '[PASS] ReSukiSU image keeps 4.14 user_path_at hooks, KPM off, cgroup v2 freezer and binder freeze verified'

      - name: Package reusable PCHM30 AnyKernel3 ZIP and Prepare Artifacts
        working-directory: source/android/kernel/msm-4.14
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/package-pchm30-run17-ak3.sh" > "$GITHUB_WORKSPACE/package-pchm30-run26-ak3.sh"
          chmod +x "$GITHUB_WORKSPACE/package-pchm30-run26-ak3.sh"
          AK3_ZIP="$GITHUB_WORKSPACE/PCHM30-Run152-BakaSU-main-SUSFS240-backport-AK3-${GITHUB_RUN_NUMBER}.zip"
          "$GITHUB_WORKSPACE/package-pchm30-run26-ak3.sh" \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$AK3_ZIP"

          export STAGE_DIR="$GITHUB_WORKSPACE/out_artifacts"
          mkdir -p "$STAGE_DIR"
          cp -f "$AK3_ZIP"* "$STAGE_DIR/"
          cp -f "$OUT_DIR/arch/arm64/boot/Image" "$STAGE_DIR/Image"
          cp -f "$OUT_DIR/.config" "$STAGE_DIR/kernel.config"
          [ -f "$OUT_DIR/System.map" ] && cp -f "$OUT_DIR/System.map" "$STAGE_DIR/System.map"
          [ -f "$OUT_DIR/vmlinux" ] && cp -f "$OUT_DIR/vmlinux" "$STAGE_DIR/vmlinux"
          for logfile in "$GITHUB_WORKSPACE"/*proof.txt "$GITHUB_WORKSPACE"/*.log; do
            [ -f "$logfile" ] && cp -f "$logfile" "$STAGE_DIR/" || true
          done

          python3 - <<'PY_MANIFEST'
          import hashlib, json, os, subprocess
          from pathlib import Path

          stage_dir = Path(os.environ.get("STAGE_DIR") or (os.environ.get("GITHUB_WORKSPACE", "") + "/out_artifacts"))
          stage_dir.mkdir(parents=True, exist_ok=True)
          source_paths = [
              'fs/susfs.c', 'fs/namei.c', 'fs/exec.c',
              'kernel/cgroup/freezer.c', 'kernel/cgroup/cgroup.c',
              'KernelSU/kernel/tools/code_generation/code_generation.mk',
              'KernelSU/kernel/sulog/fd.c',
          ]
          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          final_config = dict(
              line.split('=', 1) for line in (stage_dir / 'kernel.config').read_text().splitlines()
              if line.startswith('CONFIG_') and '=' in line
          )
          manifest = {
              "target_device": "OPPO A11x / PCHM30 (sm6125)",
              "os_target": "LineageOS 24 (Android 17)",
              "baseline_run": 152,
              "baseline_commit": os.environ["RUN152_WORKFLOW_REF"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "staged_git_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "kernel_release_label": "4.14.357-perf+",
              "kernel_release_label_only": True,
              "full_4.14.357_backport": False,
              "rootless_checkout": "0789fcca2cbcb74143492a70afc6c3b5a59251b7",
              "bakasu_commit": os.environ.get("RESUKISU_COMMIT", "auto"),
              "susfs_version": "v2.4.0-pchm30",
              "susfs_upstream_commit": os.environ["SUSFS_240_UPSTREAM"],
              "susfs_port_scope": ["priority UID package lookup", "open redirect retry lifetime", "mount lookup fast path"],
              "runtime_fixes": ["nullable RCU bitmap retirement", "fresh file for redirect retry", "fsnotify mark ownership", "freezer child inheritance"],
              "preinit_status": "disabled_missing_legacy_exec_hooks",
              "fd_cloexec_policy": "upstream_preserved",
              "tcp_default_from_final_config": final_config['CONFIG_DEFAULT_TCP_CONG'].strip('"'),
              "tcp_brutal_status": "disabled_incomplete_implementation",
              "adios_status": "not_integrated",
              "io_scheduler_available": "mq-deadline",
              "reused_workflows": {
                  key: os.environ[key] for key in
                  ["ROOT_SUCCESS_BRANCH", "EXP1_BRANCH", "WIFI_SUCCESS_BRANCH", "EXP2_BRANCH"]
              },
              "source_file_sha256": {path: sha256(path) for path in source_paths},
              "image_sha256": sha256(stage_dir / 'Image'),
              "config_sha256": sha256(stage_dir / 'kernel.config'),
              "runtime_fix_patch_sha256": sha256(Path(os.environ['GITHUB_WORKSPACE']) / 'run152-susfs-runtime-fixes.patch'),
              "manager_dual_signatures": ["0x039a", "0x38b"],
              "kpm_status": "disabled",
              "capabilities": {
                  "K00_SOURCE_MANIFEST": True,
                  "K01_DTB_CONTRACT": "stock-sm6125-preserved",
                  "K02_PSTORE_CONSOLE": True,
                  "K03_CGROUP_V2_FREEZER": True,
                  "K04_BINDER_FREEZE": True,
                  "K05_BPF_VERIFIER_LOG_FULL": True
              }
          }
          (stage_dir / "source-final-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("[PASS] source-final-manifest.json generated in artifacts")
          PY_MANIFEST

      - name: Upload Run 152 update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-Run152-BakaSU-main-SUSFS240-backport-${{ github.run_number }}
          path: |
            out_artifacts/
            run26-build.log
          compression-level: 1
          if-no-files-found: warn

