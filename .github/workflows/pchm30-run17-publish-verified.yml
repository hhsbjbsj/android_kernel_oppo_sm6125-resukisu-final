name: PCHM30 Run17 Publish Verified Flashable

on:
  workflow_dispatch:
  push:
    branches: [pchm30-a16-run17-builtin-runtime]
    paths:
      - '.github/workflows/pchm30-run17-publish-verified.yml'
      - '.github/scripts/package-pchm30-run17-ak3.sh'

permissions:
  contents: write
  actions: read

env:
  VERIFIED_ARTIFACT_ID: '9286674495'
  VERIFIED_IMAGE_SHA256: 'f92896bb8549849de1d5bff41a2e66a936fba702544b61ec8e72c428a8ffe0ea'
  VERIFIED_SOURCE_COMMIT: '942335793248cdfda03afc85319cd011ce507061'
  PUBLISH_BRANCH: 'pchm30-run17-flashables'
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: Package exact real-device-verified Run17 artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout packaging scripts only
        uses: actions/checkout@v4
        with:
          ref: pchm30-a16-run17-builtin-runtime
          fetch-depth: 1

      - name: Download exact successful Run17 number 1 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_ARTIFACT_ID}/zip" > "$GITHUB_WORKSPACE/run17-verified-artifact.zip"
          mkdir -p "$GITHUB_WORKSPACE/run17-verified-artifact"
          unzip -q "$GITHUB_WORKSPACE/run17-verified-artifact.zip" -d "$GITHUB_WORKSPACE/run17-verified-artifact"
          IMAGE="$GITHUB_WORKSPACE/run17-verified-artifact/source/android/kernel/msm-4.14/out-pchm30-a16-bpf/arch/arm64/boot/Image"
          test -s "$IMAGE"
          echo "${VERIFIED_IMAGE_SHA256}  $IMAGE" | sha256sum -c -
          cp -f "$IMAGE" "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-VERIFIED-Image"

      - name: Build AnyKernel3 from exact verified Image without recompiling
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x .github/scripts/package-pchm30-run17-ak3.sh
          .github/scripts/package-pchm30-run17-ak3.sh \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-VERIFIED-Image" \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip"

      - name: Create verified manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$GITHUB_WORKSPACE/PCHM30-RUN17-VERIFIED-MANIFEST.txt" <<EOF
          PCHM30 A16 Run17 Built-in Runtime - REAL DEVICE VERIFIED
          ========================================================
          Original build run: 32022682577
          Original artifact: 9286674495 / PCHM30-A16-RUN17-BUILTIN-RUNTIME-1
          Original source commit: ${VERIFIED_SOURCE_COMMIT}
          Kernel Image SHA256: ${VERIFIED_IMAGE_SHA256}
          Real-device result: boot OK; Wi-Fi OK; speaker OK; matching vendor module absent.
          Recompiled for this package: NO
          Package contents: exact verified Image + AnyKernel3 flashable ZIP.
          EOF
          sha256sum \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-VERIFIED-Image" \
            "$GITHUB_WORKSPACE/PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip" \
            > "$GITHUB_WORKSPACE/SHA256SUMS-RUN17-VERIFIED.txt"
          cat > "$GITHUB_WORKSPACE/README-RUN17-FLASHABLES.md" <<EOF
          # PCHM30 Run17 real-device verified flashables

          This branch stores the **exact Run17 kernel that passed real-device testing** on PCHM30 / OPPO A11x.

          - Original Actions run: \`32022682577\`
          - Source commit: \`${VERIFIED_SOURCE_COMMIT}\`
          - Kernel Image SHA256: \`${VERIFIED_IMAGE_SHA256}\`
          - Real-device result: Android boots, Wi-Fi works, speaker works, and the old matching vendor WLAN/audio module is not required.

          ## Files

          - \`PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip\`: flashable AnyKernel3 package; recommended for reuse.
          - \`PCHM30-A16-RUN17-VERIFIED-Image\`: raw kernel Image; not a boot.img and should not be flashed directly to the boot partition.
          - \`SHA256SUMS-RUN17-VERIFIED.txt\`: checksums.

          The AK3 package performs a kernel-only replacement and preserves the currently installed boot ramdisk and DTB layout.
          EOF

      - name: Upload reusable verified Run17 flashables
        uses: actions/upload-artifact@v4
        with:
          name: PCHM30-RUN17-REALDEVICE-VERIFIED-FLASHABLE
          path: |
            PCHM30-A16-RUN17-VERIFIED-Image
            PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip
            PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip.sha256
            PCHM30-RUN17-VERIFIED-MANIFEST.txt
            SHA256SUMS-RUN17-VERIFIED.txt
            README-RUN17-FLASHABLES.md
          if-no-files-found: error

      - name: Persist verified flashables on dedicated branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_AUTHOR_NAME='PCHM30 Run17 Publisher'
          export GIT_AUTHOR_EMAIL='107346247+hhsbjbsj@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          image_blob=$(git hash-object -w PCHM30-A16-RUN17-VERIFIED-Image)
          ak3_blob=$(git hash-object -w PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip)
          ak3sha_blob=$(git hash-object -w PCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip.sha256)
          manifest_blob=$(git hash-object -w PCHM30-RUN17-VERIFIED-MANIFEST.txt)
          sums_blob=$(git hash-object -w SHA256SUMS-RUN17-VERIFIED.txt)
          readme_blob=$(git hash-object -w README-RUN17-FLASHABLES.md)

          tree=$(printf '%s\n' \
            "100644 blob $readme_blob\tREADME.md" \
            "100644 blob $image_blob\tPCHM30-A16-RUN17-VERIFIED-Image" \
            "100644 blob $ak3_blob\tPCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip" \
            "100644 blob $ak3sha_blob\tPCHM30-A16-RUN17-BUILTIN-RUNTIME-VERIFIED-AK3.zip.sha256" \
            "100644 blob $manifest_blob\tPCHM30-RUN17-VERIFIED-MANIFEST.txt" \
            "100644 blob $sums_blob\tSHA256SUMS-RUN17-VERIFIED.txt" | git mktree)
          commit=$(printf '%s\n' 'PCHM30 Run17 real-device verified flashables' | git commit-tree "$tree")
          git push --force origin "$commit:refs/heads/$PUBLISH_BRANCH"
          echo "Persistent branch published: $PUBLISH_BRANCH"
